  });
  el.btnOpenTab.addEventListener('click', openInTab);
  el.btnOpenTab2.addEventListener('click', openInTab);
  el.btnZoomIn.addEventListener('click', function () { changeZoom(10); });
  el.btnZoomOut.addEventListener('click', function () { changeZoom(-10); });
  el.btnZoomReset.addEventListener('click', function () { state.zoomPercent = 100; applyZoom(); showInfo(); });
  el.btnMode.addEventListener('click', toggleMode);
  el.btnRotationToggle.addEventListener('click', toggleRotationPause);
  el.btnZoneRefresh.addEventListener('click', function () { renderZones(); toast('已刷新全部页面'); });
  el.btnCamBack.addEventListener('click', backToHome);
  el.btnCamLayout.addEventListener('click', function () { setCameraLayout(camWall.layout === 1 ? 3 : 1); });
  el.btnCamRefresh.addEventListener('click', refreshCameraWall);
  el.ctlSwitch.addEventListener('click', onCtlSwitchClick);

  /* 设备控制 screen（控制半边） */
  el.btnControl.addEventListener('click', openControl);
  el.btnCtlBack.addEventListener('click', closeControl);
  el.btnCtlReload.addEventListener('click', refreshCtlDevices);
  el.selCtlEntry.addEventListener('change', function () {
    var id = el.selCtlEntry.value;
    if (!id) return;
    ctlSend('show', { entryId: id });
    el.selCtlEntry.value = ''; // 同一页面可连续下发（含下发给不同勾选集）
  });
  el.btnCtlRotate.addEventListener('click', ctlRotateDialog);
  el.btnCtlZone.addEventListener('click', ctlZoneDialog);
  el.btnCtlHome.addEventListener('click', function () { ctlSend('home'); });
  el.btnCtlRelease.addEventListener('click', ctlRelease);
  el.btnCtlRefreshCmd.addEventListener('click', function () { ctlSend('refresh'); });
  el.btnCtlSync.addEventListener('click', function () { ctlSend('sync'); });
  el.btnCtlAll.addEventListener('click', function () {
    var allOn = ctlPanel.devices.length && ctlPanel.devices.every(function (d) { return ctlPanel.selected[d.id]; });
    ctlPanel.selected = {};
    if (!allOn) ctlPanel.devices.forEach(function (d) { ctlPanel.selected[d.id] = true; });
    renderCtlDevices();
  });

  window.addEventListener('resize', function () { applyZoom(); scaleZoneCells(); });

  /* ============================ 多设备互控 · 受控半边 ============================
   * 设计 docs/远程控制台-设计方案.md §7/§8/§10.1：
   *  - 3s 心跳（失败指数退避最长 30s）：注册 / 上报本机状态 / 领指令 / 同步模式
   *  - 模式 = 服务端权威 managed + 本机即时影子 localMode：现场拨开关立即生效，
   *    意图 switchTo 随下一拍心跳捎带，未确认前每拍重发（幂等，离线暂存恢复后送达）
   *  - 展示类指令（show/rotate/zone/home）应用后自动进入远程被控：切画面 + 锁定展示操作；
   *    维护类（refresh/sync）不改变模式
   *  - 退出远程被控一律二次确认；进入远程被控直接生效
   * ============================================================================ */

  var CTL_BEAT_MS = 3000;
  var ctl = {
    deviceId: null,          // 本机设备身份（localStorage 终身不变，与 IP 无关）
    kind: 'pc',              // pc | tablet（服务端仅用于图标与 bootRestore 默认值）
    localMode: true,         // 即时影子：true=本地控制（默认，行为与现状一致）
    ackedSeq: 0,             // 已确认应用的指令序号（内存态）
    boot: true,              // 本页面生命周期内的第一次心跳
    intent: null,            // 待送达的模式开关意图：'local' | 'remote'
    failStreak: 0,
    lastError: null,         // 指令应用失败原因（随状态上报，控制屏可见）
    lastLockToast: 0
  };

  function detectKind() {
    var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    var mobileUA = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    var iPadOS = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
    return touch && (mobileUA || iPadOS) ? 'tablet' : 'pc';
  }

  function loadDeviceId() {
    try {
      var id = localStorage.getItem('tvshow.deviceId');
      if (id) return id;
      var bytes = new Uint8Array(4);
      crypto.getRandomValues(bytes);
      id = 'dev-' + Array.prototype.map.call(bytes, function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
      localStorage.setItem('tvshow.deviceId', id);
      return id;
    } catch (e) { return null; } // 存储被禁时退化为不注册（file:// 场景）
  }

  /** 上报的本机状态（服务端据此展示设备卡片，并可在「存为场景」时转为恢复指令） */
  function currentState() {
    var s = { mode: 'home' };
    if (state.mode === 'display') {
      if (rotation.active) {
        var list = rotationEntries();
        s = {
          mode: 'rotate',
          rotate: {
            index: rotation.index, total: list.length,
            intervalSec: local.rotation.intervalSec,
            items: list.map(function (e) { return e.id; })
          }
        };
      } else {
        s = { mode: 'page', entryId: state.entry ? state.entry.id : '' };
      }
    } else if (state.mode === 'camera') {
      s = { mode: 'camera', entryId: camWall.entry ? camWall.entry.id : '' };
    } else if (state.mode === 'zones') {
      s = { mode: 'zone', zone: { slots: local.zones.map(function (z) { return z.entryId || null; }) } };
    } else if (state.mode === 'settings') {
      s = { mode: 'settings' };
    } else if (state.mode === 'control') {
      s = { mode: 'control' };
    }
    if (ctl.lastError) s.lastError = ctl.lastError;
    return s;
  }

  /** 模式影子翻转 + UI（开关高亮 / 角标 / 锁定）；立即生效，不等网络 */
  function applyMode(mode, opts) {
    opts = opts || {};
    var target = mode === 'local';
    if (ctl.localMode === target) { renderCtlSwitch(); return; }
    ctl.localMode = target;
    renderCtlSwitch();
    applyCtlLock();
    if (!opts.silent) toast(target ? '已交还本地控制' : '已进入远程被控');
  }

  function renderCtlSwitch() {
    el.csLocal.classList.toggle('on-local', ctl.localMode);
    el.csRemote.classList.toggle('on-remote', !ctl.localMode);
  }

  /** 锁定只作用于展示界面；「设备控制」屏（P3）不受锁定以保证随时可自我解除 */
  function applyCtlLock() {
    var locked = !ctl.localMode && state.mode !== 'control';
    document.body.classList.toggle('ctl-locked', locked);
    el.ctlBadge.hidden = !locked;
  }

  /** 顶栏开关：本地→远程直接生效；远程→本地须二次确认（评审决议） */
  function onCtlSwitchClick() {
    if (ctl.localMode) {
      applyMode('remote');
      ctl.intent = 'remote';
      return;
    }
    openDialog('退出远程被控？', '交还本机操作后，画面保持不变；控制端再次下发指令时会自动切回远程被控。', [
      { text: '继续远程被控', run: function () {} },   // 默认焦点在继续（防误触），与电视端一致
      { text: '退出，恢复本地操作', primary: true, run: function () {
        applyMode('local');
        ctl.intent = 'local';
      } }
    ], 'Enter 确认　Esc 取消');
  }

  /** 指令应用器：全部复用现有 screen 切换函数，不新造状态机 */
  function applyCommand(desired) {
    var cmd = desired.cmd;
    var args = desired.args || {};
    ctl.lastError = null;
    try {
      if (cmd === 'show') {
        var entry = entryOf(args.entryId);
        if (!entry) { backToHome(); ctl.lastError = '指令引用的入口已不存在'; }
        else openEntry(entry, { embed: true });
        applyMode('remote', { silent: true });
      } else if (cmd === 'rotate') {
        local.rotation = {
          enabled: local.rotation.enabled,
          intervalSec: Math.min(3600, Math.max(1, Number(args.intervalSec) || 15)),
          items: (args.items || []).filter(function (id) { return !!entryOf(id); }),
          // 同相切换时服务端已生成统一起点；否则以本机收到时刻起算
          startedAt: Number(args.startedAt) || correctedNow()
        };
        saveLocalSettings();
        stopRotation();
        // 序列里的入口在本机内容同步滞后时可能暂不可见；全部失效则不进轮询
        // （不能落到 startRotation 的「首次进入默认全部参与」分支）
        if (!local.rotation.items.length) {
          backToHome();
          ctl.lastError = '轮询序列中的入口在本机均不可用';
        } else {
          startRotation();
        }
        applyMode('remote', { silent: true });
      } else if (cmd === 'zone') {
        var slots = Array.isArray(args.slots) ? args.slots : [null, null, null, null];
        local.zones = [0, 1, 2, 3].map(function (p) {
          var id = slots[p] && entryOf(slots[p]) ? slots[p] : '';
          return { position: p, entryId: id };
        });
        saveLocalSettings();
        openZones();
        applyMode('remote', { silent: true });
      } else if (cmd === 'home') {
        backToHome();
        applyMode('remote', { silent: true });
      } else if (cmd === 'refresh') {
        if (state.mode === 'display') reloadPage();
        else if (state.mode === 'zones') { renderZones(); toast('已刷新全部页面'); }
        else if (state.mode === 'camera') refreshCameraWall();
      } else if (cmd === 'sync') {
        syncFromServer(true);
      }
    } catch (e) {
      ctl.lastError = '指令应用失败：' + (e && e.message ? e.message : e);
    }
  }

  async function doBeat() {
    if (!ctl.deviceId) return; // 无存储（file:// 且禁用 localStorage）时静默不注册
    if (!SERVER_BASE && !servedOverHttp) return;
    var body = {
      deviceId: ctl.deviceId,
      kind: ctl.kind,
      appVersion: '2.0-web',
      boot: ctl.boot,
      ackedSeq: ctl.ackedSeq,
      state: currentState()
    };
    ctl.boot = false;
    if (ctl.intent) body.switchTo = ctl.intent;
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 5000);
    try {
      var res = await fetch(SERVER_BASE + '/api/ctl/beat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: ctrl.signal,
        cache: 'no-store'
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      ctl.failStreak = 0;

      // 意图已送达且服务端状态与之相符 → 清除（未清除前每拍重发，幂等）
      if (ctl.intent && json.managed !== undefined &&
          json.managed === (ctl.intent === 'remote')) {
        ctl.intent = null;
      }

      if (json.desired) {
        applyCommand(json.desired);
        ctl.ackedSeq = json.desired.seq;
      } else if (!ctl.intent) {
        // 纯模式校正（无在途意图时）：控制端「取消控制」→ 解锁；boot 恢复 → 锁定
        if (json.managed === false && !ctl.localMode) {
          applyMode('local');
          toast('控制端已交还本地控制');
        } else if (json.managed === true && ctl.localMode) {
          applyMode('remote', { silent: true });
        }
      }
    } catch (e) {
      clearTimeout(timer);
      ctl.failStreak++;
      // 离线保持：受控态下画面继续（本机设置已写入），恢复后心跳自动续上
    } finally {
      var delay = ctl.failStreak === 0
        ? CTL_BEAT_MS
        : Math.min(30000, CTL_BEAT_MS * Math.pow(2, ctl.failStreak));
      setTimeout(doBeat, delay);
    }
  }

  function initCtl() {
    ctl.deviceId = loadDeviceId();
    ctl.kind = detectKind();
    renderCtlSwitch();
    if (ctl.deviceId) doBeat();
  }

  /* ============================ 多设备互控 · 控制半边（设备控制 screen） ============================
   * 设计 §11：设备卡片（勾选/改名/模式/在线/状态摘要/待送达/本机标记）+ 底部操作条。
   * 单台控制是原语（只勾一台下发）；多选 / 全选只是便捷方式。
   * 「取消控制」与设备端开关是同一状态翻转的两个入口，执行前一律二次确认。
   * ============================================================================ */

  var ctlPanel = {
    devices: [],            // 最近一次 /api/ctl/devices
    selected: {},           // 勾选的 deviceId 集合
    timer: null,            // 3s 列表轮询（仅 control screen 激活期间）
    modalOpen: false,       // 自定义配置弹层（轮询/分屏/改名，复用 dialogLayer）
    rotateDraft: [],        // 轮询弹层的已选序列（顺序即播放顺序）
    zoneDraft: [null, null, null, null]
  };

  function openControl() {
    stopRotation();
    state.mode = 'control';
    state.entry = null;
    el.homeScreen.hidden = true;
    el.displayScreen.hidden = true;
    el.zoneScreen.hidden = true;
    el.settingsScreen.hidden = true;
    el.cameraScreen.hidden = true;
    el.controlScreen.hidden = false;
    syncToolGroups();
    renderCtlEntryOptions();
    refreshCtlDevices();
    clearInterval(ctlPanel.timer);
    ctlPanel.timer = setInterval(function () {
      if (state.mode === 'control') refreshCtlDevices();
    }, 3000);
  }

  function closeControl() {
    clearInterval(ctlPanel.timer);
    ctlPanel.timer = null;
    backToHome();
  }

  function renderCtlEntryOptions() {
    var sel = el.selCtlEntry;
    sel.innerHTML = '<option value="">显示页面…</option>';
    ENTRIES.forEach(function (e) {
      var opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.title;
      sel.appendChild(opt);
    });
  }

  async function refreshCtlDevices() {
    if (!SERVER_BASE && !servedOverHttp) { el.ctlServerChip.textContent = '未连接服务端'; return; }
    try {
      var res = await fetch(SERVER_BASE + '/api/ctl/devices', { cache: 'no-store' });
      var json = await res.json();
      ctlPanel.devices = json.devices || [];
      el.ctlServerChip.textContent = '服务端 v' + CFG.version + ' · ' + ctlPanel.devices.length + ' 台设备';
      renderCtlDevices();
    } catch (e) {
      el.ctlServerChip.textContent = '服务端不可达';
    }
  }

  /** reported → 人能读的状态摘要 */
  function ctlSummary(d) {
    var r = d.reported;
    if (!r) return '暂无上报';
    function titleOf(id) { var e = id && entryOf(id); return e ? e.title : (id || '—'); }
    if (r.mode === 'home') return '首页';
    if (r.mode === 'page') return '显示：' + titleOf(r.entryId);
    if (r.mode === 'camera') return '画面墙：' + titleOf(r.entryId);
    if (r.mode === 'rotate' && r.rotate) {
      return '轮询 ' + (Number(r.rotate.index) + 1) + '/' + r.rotate.total + ' · ' + r.rotate.intervalSec + 's';
    }
    if (r.mode === 'zone' && r.zone && r.zone.slots) {
      return '分屏：' + r.zone.slots.map(function (s) {
        return s ? titleOf(s).slice(0, 6) : '—';
      }).join(' / ');
    }
    if (r.mode === 'control') return '控制中';
    if (r.mode === 'settings') return '本机设置';
    if (r.lastError) return r.lastError;
    return r.mode || '—';
  }

  function renderCtlDevices() {
    var host = el.ctlDeviceList;
    // 只重绘内容变化的部分代价不值得：设备数少（几台），整体重绘但保留勾选态
    host.innerHTML = '';
    if (!ctlPanel.devices.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--muted);font-size:13px;padding:22px;text-align:center;';
      empty.textContent = '还没有设备注册 —— 用电脑或平板打开本系统、或在电视上安装 1.8 客户端后，会自动出现在这里';
      host.appendChild(empty);
    }
    ctlPanel.devices.forEach(function (d) {
      var card = document.createElement('div');
      card.className = 'ctl-card' + (d.id === ctl.deviceId ? ' self' : '');

      var ck = document.createElement('input');
      ck.type = 'checkbox';
      ck.className = 'ck';
      ck.checked = !!ctlPanel.selected[d.id];
      ck.addEventListener('change', function () {
        if (ck.checked) ctlPanel.selected[d.id] = true;
        else delete ctlPanel.selected[d.id];
        renderCtlSelInfo();
      });
      card.appendChild(ck);

      var kind = document.createElement('div');
      kind.className = 'kind';
      kind.textContent = d.kind === 'tv' ? 'TV' : d.kind === 'tablet' ? '平板' : 'PC';
      card.appendChild(kind);

      var main = document.createElement('div');
      main.className = 'main';
      var nm = document.createElement('div');
      nm.className = 'nm';
      var b = document.createElement('b');
      b.textContent = d.name;
      nm.appendChild(b);
      if (d.id === ctl.deviceId) {
        var tag = document.createElement('span');
        tag.className = 'self-tag';
        tag.textContent = '本机';
        nm.appendChild(tag);
      }
      var st = document.createElement('div');
      st.className = 'st';
      var dot = document.createElement('span');
      dot.className = 'dot ' + d.online;
      dot.title = d.online === 'online' ? '在线' : d.online === 'recent' ? '刚离线' : '离线';
      var modeChip = document.createElement('span');
      modeChip.className = 'chip ' + (d.managed ? 'remote' : 'local');
      modeChip.textContent = d.managed ? '远程被控' : '本地控制';
      var summary = document.createElement('span');
      summary.textContent = ctlSummary(d);
      st.appendChild(dot);
      st.appendChild(modeChip);
      if (d.pending) {
        var pend = document.createElement('span');
        pend.className = 'chip pending';
        pend.textContent = '待送达';
        st.appendChild(pend);
      }
      st.appendChild(summary);
      if (d.reported && d.reported.lastError) {
        var errc = document.createElement('span');
        errc.className = 'chip pending';
        errc.textContent = d.reported.lastError;
        st.appendChild(errc);
      }
      main.appendChild(nm);
      main.appendChild(st);
      card.appendChild(main);

      var ops = document.createElement('div');
      ops.className = 'ops';
      var rename = document.createElement('button');
      rename.className = 'btn';
      rename.textContent = '改名';
      rename.addEventListener('click', function () { ctlRenameDialog(d); });
      var boot = document.createElement('button');
      boot.className = 'btn';
      boot.textContent = '开机恢复：' + (d.bootRestore ? '开' : '关');
      boot.title = '受控状态下设备重启后自动回到设定画面';
      boot.addEventListener('click', function () { ctlSetBootRestore(d, !d.bootRestore); });
      ops.appendChild(rename);
      ops.appendChild(boot);
      card.appendChild(ops);
      host.appendChild(card);
    });
    renderCtlSelInfo();
  }

  function renderCtlSelInfo() {
    var n = Object.keys(ctlPanel.selected).length;
    el.ctlSelInfo.textContent = n
      ? '已勾选 ' + n + ' 台设备（对勾选设备执行以下操作）'
      : '未勾选设备（先勾选，或点「全选」）';
  }

  function ctlTargets() {
    var ids = Object.keys(ctlPanel.selected);
    return ids.length ? ids : null;
  }

  async function ctlSend(cmd, args) {
    var targets = ctlTargets();
    if (!targets) { toast('请先勾选目标设备'); return false; }
    try {
      var res = await fetch(SERVER_BASE + '/api/ctl/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targets: targets, cmd: cmd, args: args || {} })
      });
      var json = await res.json();
      if (!res.ok) { toast('下发失败：' + (json && json.error ? json.error : 'HTTP ' + res.status)); return false; }
      toast('已下发「' + cmd + '」→ ' + json.results.length + ' 台设备（≤3 秒生效）');
      refreshCtlDevices();
      return true;
    } catch (e) {
      toast('下发失败：网络不可达');
      return false;
    }
  }

  async function ctlRelease() {
    var targets = ctlTargets();
    if (!targets) { toast('请先勾选目标设备'); return; }
    openDialog('取消控制？', '勾选的 ' + targets.length + ' 台设备将退出远程被控、恢复本地操作（画面保持不变）。', [
      { text: '继续控制', run: function () {} },
      { text: '取消控制，交还本地', primary: true, run: async function () {
        try {
          var res = await fetch(SERVER_BASE + '/api/ctl/release', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ targets: targets })
          });
          var json = await res.json();
          toast(res.ok ? '已交还 ' + json.results.length + ' 台设备' : '操作失败：HTTP ' + res.status);
        } catch (e) { toast('操作失败：网络不可达'); }
        refreshCtlDevices();
      } }
    ], 'Enter 确认　Esc 取消');
  }

  /* ---------- 自定义配置弹层（轮询 / 分屏 / 改名），复用 dialogLayer 外观 ---------- */

  function openCtlModal(title, subtitle) {
    closeCtlModal();
    var box = document.createElement('div');
    box.className = 'dialog ctl-modal';
    var head = document.createElement('header');
    var h = document.createElement('h3');
    h.textContent = title;
    head.appendChild(h);
    if (subtitle) {
      var p = document.createElement('p');
      p.textContent = subtitle;
      head.appendChild(p);
    }
    var list = document.createElement('div');
    list.className = 'list';
    var footer = document.createElement('footer');
    box.appendChild(head);
    box.appendChild(list);
    box.appendChild(footer);
    el.dialogLayer.appendChild(box);
    el.dialogLayer.hidden = false;
    ctlPanel.modalOpen = true;
    return { list: list, footer: footer };
  }

  function closeCtlModal() {
    ctlPanel.modalOpen = false;
    el.dialogLayer.hidden = true;
    el.dialogLayer.innerHTML = '';
  }

  /** 轮询配置弹层：间隔预设 + 参与页面多选调序 + 多屏同步切换（默认不勾） */
  function ctlRotateDialog() {
    if (!ctlTargets()) { toast('请先勾选目标设备'); return; }
    ctlPanel.rotateDraft = [];
    var ui = openCtlModal('轮询下发', '勾选参与页面（↑↓ 调整顺序），确定后对勾选设备立即开始轮询');

    var rowIv = document.createElement('div');
    rowIv.className = 'row';
    var lb = document.createElement('label');
    lb.textContent = '每页停留';
    var selIv = document.createElement('select');
    INTERVAL_PRESETS.forEach(function (s) {
      var o = document.createElement('option');
      o.value = String(s);
      o.textContent = s + ' 秒';
      selIv.appendChild(o);
    });
    selIv.value = '15';
    lb.appendChild(selIv);
    rowIv.appendChild(lb);

    var rowSync = document.createElement('div');
    rowSync.className = 'row';
    var lb2 = document.createElement('label');
    var ckSync = document.createElement('input');
    ckSync.type = 'checkbox';
    ckSync.checked = false; // 同步轮询默认关（评审决议）
    lb2.appendChild(ckSync);
    var lb2t = document.createElement('span');
    lb2t.textContent = '多屏同步切换（各设备翻页时机一致，依赖内网时钟）';
    lb2.appendChild(lb2t);
    rowSync.appendChild(lb2);

    var listBox = document.createElement('div');
    function renderRows() {
      listBox.innerHTML = '';
      ENTRIES.forEach(function (e) {
        var idx = ctlPanel.rotateDraft.indexOf(e.id);
        var row = document.createElement('div');
        row.className = 'row';
        var ck = document.createElement('input');
        ck.type = 'checkbox';
        ck.checked = idx >= 0;
        ck.addEventListener('change', function () {
          if (ck.checked) ctlPanel.rotateDraft.push(e.id);
          else ctlPanel.rotateDraft = ctlPanel.rotateDraft.filter(function (x) { return x !== e.id; });
          renderRows();
        });
        var name = document.createElement('span');
        name.className = 'grow';
        name.textContent = (idx >= 0 ? (idx + 1) + '. ' : '') + e.title;
        row.appendChild(ck);
        row.appendChild(name);
        if (idx >= 0) {
          ['↑', '↓'].forEach(function (dir, k) {
            var btn = document.createElement('button');
            btn.className = 'mini-btn';
            btn.textContent = dir;
            btn.addEventListener('click', function () {
              var j = dir === '↑' ? idx - 1 : idx + 1;
              if (j < 0 || j >= ctlPanel.rotateDraft.length) return;
              var t = ctlPanel.rotateDraft[idx];
              ctlPanel.rotateDraft[idx] = ctlPanel.rotateDraft[j];
              ctlPanel.rotateDraft[j] = t;
              renderRows();
            });
            row.appendChild(btn);
          });
        }
        listBox.appendChild(row);
      });
    }
    renderRows();

    var ok = document.createElement('button');
    ok.className = 'btn primary';
    ok.textContent = '下发轮询';
    ok.addEventListener('click', function () {
      if (!ctlPanel.rotateDraft.length) { toast('请至少勾选一个页面'); return; }
      if (ctlSend('rotate', {
        intervalSec: Number(selIv.value),
        items: ctlPanel.rotateDraft.slice(),
        phaseSync: ckSync.checked
      })) closeCtlModal();
    });
    var cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = '取消';
    cancel.addEventListener('click', closeCtlModal);

    ui.list.appendChild(rowIv);
    ui.list.appendChild(rowSync);
    ui.list.appendChild(listBox);
    ui.footer.appendChild(cancel);
    ui.footer.appendChild(ok);
  }

  /** 2×2 分屏配置弹层：四格各选页面或「不使用」 */
  function ctlZoneDialog() {
    if (!ctlTargets()) { toast('请先勾选目标设备'); return; }
    ctlPanel.zoneDraft = [null, null, null, null];
    var ui = openCtlModal('2×2 分屏下发', '为四个分区各指定页面（或「不使用」），确定后对勾选设备进入分屏');

    var grid = document.createElement('div');
    grid.className = 'zonegrid';
    ctlPanel.zoneDraft.forEach(function (_, pos) {
      var cell = document.createElement('div');
      cell.className = 'zg';
      var span = document.createElement('span');
      span.textContent = '第 ' + (pos + 1) + ' 格';
      var sel = document.createElement('select');
      var none = document.createElement('option');
      none.value = '';
      none.textContent = '不使用';
      sel.appendChild(none);
      ENTRIES.forEach(function (e) {
        var o = document.createElement('option');
        o.value = e.id;
        o.textContent = e.title;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        ctlPanel.zoneDraft[pos] = sel.value || null;
      });
      cell.appendChild(span);
      cell.appendChild(sel);
      grid.appendChild(cell);
    });

    var ok = document.createElement('button');
    ok.className = 'btn primary';
    ok.textContent = '下发分屏';
    ok.addEventListener('click', function () {
      if (!ctlPanel.zoneDraft.some(function (s) { return s; })) { toast('至少为一格指定页面'); return; }
      if (ctlSend('zone', { slots: ctlPanel.zoneDraft.slice() })) closeCtlModal();
    });
    var cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = '取消';
    cancel.addEventListener('click', closeCtlModal);

    ui.list.appendChild(grid);
    ui.footer.appendChild(cancel);
    ui.footer.appendChild(ok);
  }

  /** 设备改名弹层 */
  function ctlRenameDialog(d) {
    var ui = openCtlModal('设备改名', d.id);
    var row = document.createElement('div');
    row.className = 'row';
    var input = document.createElement('input');
    input.type = 'text';
    input.value = d.name;
    input.maxLength = 60;
    input.style.cssText = 'flex:1;background:rgba(9,16,28,.9);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;';
    row.appendChild(input);
    var ok = document.createElement('button');
    ok.className = 'btn primary';
    ok.textContent = '保存';
    ok.addEventListener('click', async function () {
      var name = input.value.trim();
      if (!name) { toast('设备名不能为空'); return; }
      try {
        var res = await fetch(SERVER_BASE + '/api/ctl/device/' + encodeURIComponent(d.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        });
        toast(res.ok ? '已改名：' + name : '改名失败：HTTP ' + res.status);
      } catch (e) { toast('改名失败：网络不可达'); }
      closeCtlModal();
      refreshCtlDevices();
    });
    var cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = '取消';
    cancel.addEventListener('click', closeCtlModal);
    ui.list.appendChild(row);
    ui.footer.appendChild(cancel);
    ui.footer.appendChild(ok);
    setTimeout(function () { input.focus(); }, 50);
  }

  async function ctlSetBootRestore(d, value) {
    try {
      var res = await fetch(SERVER_BASE + '/api/ctl/device/' + encodeURIComponent(d.id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bootRestore: value })
      });
      toast(res.ok ? (d.name + ' 开机恢复：' + (value ? '开' : '关')) : '操作失败：HTTP ' + res.status);
    } catch (e) { toast('操作失败：网络不可达'); }
    refreshCtlDevices();
  }


  loadLocalSettings();
  renderTurboButton();
  applyConfig(CFG, false);
  syncClockOffset();
  // 启动不阻塞于网络：先用兜底内容渲染首屏，再后台增量同步
  syncFromServer(false);
  initCtl(); // 多设备互控：注册心跳 + 领指令（受控半边）
  // /console 深链直达「设备控制」（平板书签场景）
  if (/[?&]screen=control\b/.test(location.search)) openControl();
  setTimeout(function () { if (!rotation.active) applyZoom(); }, 200);
})();
</script>
</body>
