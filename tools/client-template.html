<script>
(function () {
  'use strict';

  /* ==========================================================================
   * 电脑浏览器客户端
   *   - 复刻电视端的全部「内容与展示策略」能力，去掉遥控器概念
   *   - 数据来源与增量同步协议与电视端完全一致（/api/config，同源相对路径）
   *   - 轮询 / 分区是「本机展示策略」，存在 localStorage（键与预览页一致）
   *   - 自动登录：直连 iframe 跨域无法注入脚本，只有切到「代理」模式下同源才能注入
   * ========================================================================== */

  var LS_KEY = 'tvshow.localSettings';
  var ZONE_MIN = { width: 1920, height: 1080 };
  var INTERVAL_PRESETS = [5, 10, 15, 20, 30, 45, 60, 120, 300];
  var LOAD_TIMEOUT_MS = 12000;

  var el = {};
  ['appTitle','appSubtitle','brandTitle','brandSub','clockTime','clockDate','grid',
   'btnSync','btnRotation','btnZones','btnSettings','btnFullscreen','btnAdmin',
   'btnMore','moreMenu','btnTurbo',
   'homeScreen','displayScreen','cameraScreen','zoneScreen','settingsScreen',
   'cameraTools','camGrid','btnCamBack','btnCamLayout','btnCamRefresh',
   'homeTools','displayTools','frameViewport','frameBox','progress','infoOverlay','loadingPanel','loadingText',
   'errorPanel','errorMessage','rotationChip','rotationText','btnRotationToggle','zoomChip','btnMode',
   'btnBack','btnBack2','btnRetry','btnUseProxy','btnOpenTab','btnOpenTab2','btnZoomIn',
   'btnZoomOut','btnZoomReset','btnMenu','zoneGrid','zoneHint','btnZoneBack','btnZoneRefresh',
   'settingsList','btnSettingsBack','settingsState','dialogLayer','toast',
   'ctlSwitch','csLocal','csRemote','ctlBadge',
   'controlScreen','btnCtlBack','ctlServerChip','btnCtlReload','ctlDeviceList',
   'ctlSelInfo','selCtlEntry','btnCtlRotate','btnCtlZone','btnCtlHome','btnCtlRelease',
   'btnCtlRefreshCmd','btnCtlSync','btnCtlAll','btnControl'
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  var AUTO_LOGIN_SRC = document.getElementById('autoLoginSrc').textContent;

  /* ---------------- 引导配置：先渲染兜底内容，不阻塞于网络 ---------------- */
  var boot = {};
  try { boot = JSON.parse(document.getElementById('bootstrap').textContent) || {}; } catch (e) { boot = {}; }
  var fallback = boot.fallback || boot;
  var servedOverHttp = /^https?:$/.test(location.protocol);
  // 页面由服务端自身托管时用同源相对路径；直接打开本地文件时才回退到引导里的地址
  var SERVER_BASE = servedOverHttp ? '' : String(boot.serverBaseUrl || '').replace(/\/+$/, '');

  var CFG = {
    appTitle: String(fallback.appTitle || '数智中心大屏聚合平台'),
    appSubtitle: String(fallback.appSubtitle || ''),
    exitConfirm: fallback.exitConfirm !== false,
    exitTip: String(fallback.exitTip || '确定要退出客户端吗？'),
    entries: Array.isArray(fallback.entries) ? fallback.entries.slice() : [],
    version: 0,
    epoch: 0
  };
  var ENTRIES = CFG.entries;
  var source = 'fallback';
  var clockOffset = 0;

  /** 本地展示策略（对应电视端 LocalSettings） */
  var local = {
    rotation: { enabled: false, intervalSec: 15, items: [], startedAt: 0 },
    zones: [0, 1, 2, 3].map(function (p) { return { position: p, entryId: '' }; }),
    // 每个入口的打开方式：'auto' | 'proxy' | 'direct'
    proxyModes: {},
    // 极速模式本机总开关（默认关）；各页刷新率/是否参与由服务端配置统一下发
    turboEnabled: false,
    exitGuard: true
  };

  var state = { mode: 'home', entry: null, focusNodes: [], focus: null, zoomPercent: 100, loadingTimer: null };
  var rotation = { active: false, paused: false, index: 0, advanceTimer: null, tickTimer: null };
  var zones = { active: 0, flashTimer: null };
  var dialog = { open: false, items: [], focus: 0, onCancel: null };
  var settingsTimer = null;

  /* ============================ 小工具 ============================ */

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(el.toast._t);
    el.toast._t = setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
  }

  function entryOf(id) {
    for (var i = 0; i < ENTRIES.length; i++) if (ENTRIES[i].id === id) return ENTRIES[i];
    return null;
  }

  function correctedNow() { return Date.now() + clockOffset; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function tickClock() {
    var d = new Date();
    el.clockTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    var week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    el.clockDate.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' 星期' + week;
  }
  setInterval(tickClock, 1000);
  tickClock();

  /** 用服务端 Date 头校正本机时钟：轮询位置由时钟推导，多端才能一致 */
  async function syncClockOffset() {
    if (!SERVER_BASE && !servedOverHttp) return;
    try {
      var res = await fetch(SERVER_BASE + '/api/version', { cache: 'no-store' });
      var dateHeader = res.headers.get('date');
      if (dateHeader) clockOffset = new Date(dateHeader).getTime() - Date.now();
    } catch (e) { /* 离线也无妨：用本机时钟 */ }
  }

  function iconSvg(kind) {
    if (kind === 'storage') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>';
    }
    if (kind === 'env') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 20h18"/><path d="M6 20V9l6-4 6 4v11"/><path d="M10 20v-5h4v5"/></svg>';
    }
    if (kind === 'security') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 16l4.5-4.5 3.5 3.5 3-3L21 16"/></svg>';
  }

  /* ============================ 本机设置持久化 ============================ */

  function loadLocalSettings() {
    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
    if (!raw) return;
    try {
      var obj = JSON.parse(raw) || {};
      var r = obj.rotation || {};
      var iv = parseInt(r.intervalSec, 10);
      local.rotation = {
        enabled: r.enabled === true,
        intervalSec: isFinite(iv) ? Math.min(3600, Math.max(1, iv)) : 15,
        items: Array.isArray(r.items) ? r.items.filter(function (x) { return typeof x === 'string' && x; }) : [],
        startedAt: Number(r.startedAt) || 0
      };
      if (Array.isArray(obj.zones)) {
        local.zones = [0, 1, 2, 3].map(function (p) {
          var hit = obj.zones.filter(function (z) { return z && Number(z.position) === p; })[0];
          return { position: p, entryId: hit && typeof hit.entryId === 'string' ? hit.entryId : '' };
        });
      }
      local.proxyModes = obj.proxyModes && typeof obj.proxyModes === 'object' ? obj.proxyModes : {};
      local.turboEnabled = obj.turboEnabled === true;
      local.exitGuard = obj.exitGuard !== false;
    } catch (e) { /* 脏数据就用默认值 */ }
  }

  function saveLocalSettings() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(local)); } catch (e) { toast('本机设置保存失败：' + e.message); }
  }

  /* ============================ 增量同步（协议与电视端一致） ============================ */

  function mergeDelta(delta) {
    if (!delta || typeof delta.version !== 'number') return null;
    if (!delta.full && CFG.epoch && Number(delta.epoch) !== Number(CFG.epoch)) return null; // 代次变化 → 全量
    if (!delta.full && Number(delta.version) < Number(CFG.version)) return null;            // 版本回退 → 全量

    var map = new Map();
    ENTRIES.forEach(function (e) { map.set(e.id, e); });
    (delta.upserted || []).forEach(function (e) { if (e && e.id) map.set(e.id, e); });
    (delta.deletedIds || []).forEach(function (id) { map.delete(id); });

    var ordered = [];
    if (Array.isArray(delta.order) && delta.order.length) {
      // 顺序必须显式下发：仅凭 upserted 无法表达「整体重排」
      delta.order.forEach(function (id) { if (map.has(id)) { ordered.push(map.get(id)); map.delete(id); } });
    }
    map.forEach(function (e) { ordered.push(e); });

    var meta = delta.meta;
    return {
      appTitle: meta ? meta.appTitle : CFG.appTitle,
      appSubtitle: meta ? meta.appSubtitle : CFG.appSubtitle,
      exitConfirm: meta ? meta.exitConfirm : CFG.exitConfirm,
      exitTip: meta ? meta.exitTip : CFG.exitTip,
      entries: ordered,
      version: delta.version,
      epoch: delta.epoch
    };
  }

  function applyConfig(cfg, fromServer) {
    var changed = cfg.version !== CFG.version ||
      JSON.stringify(cfg.entries) !== JSON.stringify(CFG.entries) ||
      cfg.appTitle !== CFG.appTitle ||
      cfg.appSubtitle !== CFG.appSubtitle;
    CFG = cfg;
    ENTRIES = CFG.entries;
    if (fromServer) source = 'server';
    el.appTitle.textContent = CFG.appTitle;
    el.appSubtitle.textContent = CFG.appSubtitle;
    el.brandTitle.textContent = CFG.appTitle;
    el.brandSub.textContent = CFG.appSubtitle;
    document.title = CFG.appTitle + ' · 电脑端';
    if (!changed) return false;
    renderHome();
    // 展示页内的内容变化不即时生效（与电视端一致：下次进入生效）
    if (state.mode === 'home') focusFirst();
    if (state.mode === 'zones') renderZones();
    if (state.mode === 'control') renderCtlEntryOptions(); // 下发下拉跟随最新页面列表
    return true;
  }

  async function syncFromServer(force) {
    if (!SERVER_BASE && !servedOverHttp) {
      if (force) toast('未配置服务器地址，无法同步');
      return;
    }
    try {
      var res = await fetch(SERVER_BASE + '/api/config?since=' + CFG.version + '&epoch=' + CFG.epoch, {
        headers: { 'Accept': 'application/json' }, cache: 'no-store'
      });
      if (res.status === 304) {
        source = 'server';
        if (force) toast('已是最新配置（v' + CFG.version + '）');
        return;
      }
      if (!res.ok) throw new Error('服务端返回 HTTP ' + res.status);
      var body = await res.json();

      if (body.full) {
        var full = body.full;
        applyConfig({
          appTitle: full.appTitle, appSubtitle: full.appSubtitle,
          exitConfirm: full.exitConfirm, exitTip: full.exitTip,
          entries: full.entries || [], version: body.version, epoch: body.epoch
        }, true);
      } else {
        var merged = mergeDelta(body);
        if (!merged) {
          // 代次变化 / 版本回退 → 降级全量重拉（与电视端一致）
          var r2 = await fetch(SERVER_BASE + '/api/config?full=1', { cache: 'no-store' });
          if (!r2.ok) throw new Error('全量重拉失败 HTTP ' + r2.status);
          var full2 = await r2.json();
          applyConfig({
            appTitle: full2.full.appTitle, appSubtitle: full2.full.appSubtitle,
            exitConfirm: full2.full.exitConfirm, exitTip: full2.full.exitTip,
            entries: full2.full.entries || [], version: full2.version, epoch: full2.epoch
          }, true);
        } else {
          applyConfig(merged, true);
        }
      }
      toast('已从服务器同步到 v' + CFG.version);
    } catch (e) {
      if (force) toast('同步失败，继续使用' + (source === 'server' ? '上次同步的内容' : '内置兜底内容'));
    }
  }

  /* ============================ 首页 ============================ */

  function renderHome() {
    el.grid.innerHTML = '';
    if (!ENTRIES.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--muted);font-size:14px;padding:20px';
      empty.textContent = '暂无页面，请先在管理后台添加。';
      el.grid.appendChild(empty);
      state.focusNodes = [];
      state.focus = null;
      return;
    }
    ENTRIES.forEach(function (entry) {
      var tile = document.createElement('button');
      tile.className = 'tile';
      tile.style.setProperty('--accent', entry.accent || '#2FD2F5');
      tile.setAttribute('data-id', entry.id);

      var ic = document.createElement('div');
      ic.className = 'tile-icon';
      ic.innerHTML = iconSvg(entry.icon);
      var t = document.createElement('div');
      t.className = 'tile-title';
      t.textContent = entry.title;

      var sub = document.createElement('div');
      sub.className = 'tile-sub';
      sub.textContent = entry.subtitle || '';

      var foot = document.createElement('div');
      foot.className = 'tile-foot';
      var urlTag = document.createElement('span');
      urlTag.className = 'tile-url';
      // 画面墙没有外部网址，用一句说明代替，避免卡片出现空白条
      urlTag.textContent = entry.type === 'camera' ? '内置画面墙 · 点击直接观看' : entry.url;
      foot.appendChild(urlTag);

      tile.appendChild(ic);
      tile.appendChild(t);
      tile.appendChild(sub);
      tile.appendChild(foot);
      tile.addEventListener('mouseenter', function () { applyFocus(tile); });
      tile.addEventListener('click', function () { openEntry(entry); });
      el.grid.appendChild(tile);
    });
    cacheFocusNodes();
  }

  function cacheFocusNodes() {
    state.focusNodes = Array.prototype.slice.call(el.grid.querySelectorAll('.tile'));
  }

  function applyFocus(node) {
    state.focusNodes.forEach(function (n) { n.classList.remove('focused'); });
    state.focus = node || null;
    if (node) node.classList.add('focused');
  }

  function focusFirst() {
    cacheFocusNodes();
    applyFocus(state.focusNodes[0] || null);
  }

  /** 按几何位置推断栅格列数，方向键才能「上下左右」移动 */
  function gridColumns() {
    if (!state.focusNodes.length) return 1;
    var tops = {};
    state.focusNodes.forEach(function (n) { tops[n.offsetTop] = 1; });
    var first = state.focusNodes[0].offsetTop;
    var sameRow = state.focusNodes.filter(function (n) { return n.offsetTop === first; }).length;
    return Math.max(1, sameRow);
  }

  function moveFocus(dx, dy) {
    if (!state.focusNodes.length) return;
    var cur = state.focusNodes.indexOf(state.focus);
    if (cur < 0) return applyFocus(state.focusNodes[0]);
    var cols = gridColumns();
    var next = cur + dx + dy * cols;
    if (next < 0 || next >= state.focusNodes.length) return;
    applyFocus(state.focusNodes[next]);
    if (state.focusNodes[next].scrollIntoView) {
      state.focusNodes[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* ============================ 展示页：直连 / 代理 ============================ */

  function openModeOf(entry) {
    var pref = local.proxyModes[entry.id];
    if (pref === 'proxy' || pref === 'direct') return pref;
    // auto：配了自动登录的页面走代理才有意义（跨域 iframe 无法注入脚本）
    return (entry.autoLogin && entry.autoLogin.enabled !== false && entry.autoLogin.password) ? 'proxy' : 'direct';
  }

  function directSrcOf(entry) { return entry.url; }

  /* ---------------- 极速模式：本机总开关 + 服务端截图包装页 ---------------- */

  /** 极速模式是否对该页生效：本机开关开 且 页面在服务端配置为参与（camera 不参与） */
  function turboOn(entry) {
    return local.turboEnabled && entry && entry.type !== 'camera' && entry.turboEnabled !== false;
  }

  /** 极速模式地址：服务端包装页，刷新率/质量由服务端按该页配置内联注入 */
  function turboSrcOf(entry) {
    return '/shot/' + encodeURIComponent(entry.id) + '/view';
  }

  /** 极速模式开关按钮文案 */
  function renderTurboButton() {
    el.btnTurbo.textContent = '极速模式：' + (local.turboEnabled ? '开' : '关');
    el.btnTurbo.classList.toggle('on', local.turboEnabled);
  }

  function toggleTurbo() {
    local.turboEnabled = !local.turboEnabled;
    saveLocalSettings();
    renderTurboButton();
    toast(local.turboEnabled
      ? '已开启极速模式（各页面刷新率见后台设置）'
      : '已关闭极速模式，恢复真实页面');
    // 正在展示的页面立即按新地址重载；分区页 4 格全部重载
    if (state.mode === 'display' && state.entry) mountFrame(state.entry);
    if (zones.active) renderZones();
  }

  /** 代理地址：/proxy/<id> + 上游 pathname + search + hash（路径 1:1 镜像） */
  function proxySrcOf(entry) {
    try {
      var u = new URL(entry.url, location.href);
      return '/proxy/' + encodeURIComponent(entry.id) + u.pathname + u.search + u.hash;
    } catch (e) {
      return '/proxy/' + encodeURIComponent(entry.id) + '/';
    }
  }

  function srcOf(entry) {
    // 画面墙：内嵌服务端画面墙网页（三条按行合成 MJPEG 铺满 1920×1080）
    if (entry && entry.type === 'camera') return SERVER_BASE + '/cam/view';
    if (turboOn(entry)) return turboSrcOf(entry);
    return openModeOf(entry) === 'proxy' ? proxySrcOf(entry) : directSrcOf(entry);
  }

  function renderModeButton() {
    if (!state.entry) return;
    var mode = openModeOf(state.entry);
    el.btnMode.textContent = mode === 'proxy' ? '代理模式' : '直连模式';
    el.btnMode.className = 'btn' + (mode === 'proxy' ? ' on' : '');
    el.btnMode.title = mode === 'proxy'
      ? '当前经服务端反向代理（同源，可自动登录）；点击改为直连'
      : '当前直连目标地址；点击改为代理（同源，可自动登录）';
  }

  function openEntry(entry, opts) {
    opts = opts || {};
    // 摄像头画面墙：客户端内置页面，直接播放服务端转码后的 MJPEG，不走 iframe。
    // 轮询播放中的画面墙例外：走展示模式内嵌服务端 /cam/view 画面墙网页
    if (entry.type === 'camera' && !opts.rotation) {
      stopRotation();
      openCameraWall(entry);
      return;
    }
    // 「强制原址打开」：原生视频插件等页面无法内嵌，点击时直接在新标签访问。
    // 配了自动登录的入口走代理地址——独立标签页里由服务端代理注入自动登录脚本
    // （远程指令指定该入口时例外：受控设备无人值守，仍内嵌打开，opts.embed）
    if (entry.openOriginal === true && !opts.embed) {
      if (!opts.rotation) stopRotation();
      var useProxy = entry.autoLogin && entry.autoLogin.enabled !== false && entry.autoLogin.password;
      toast('正在新标签页打开「' + entry.title + '」' + (useProxy ? '（含自动登录）' : ''));
      window.open(useProxy ? proxySrcOf(entry) : entry.url, '_blank', 'noopener');
      return;
    }
    if (!opts.rotation) stopRotation();
    if (state.mode === 'camera') closeCameraWall();
    state.mode = 'display';
    state.entry = entry;
    el.homeScreen.hidden = true;
    el.zoneScreen.hidden = true;
    el.settingsScreen.hidden = true;
    el.cameraScreen.hidden = true;
    el.displayScreen.hidden = false;
    syncToolGroups();
    state.zoomPercent = 100;
    renderModeButton();
    mountFrame(entry);
    showInfo();
  }

  function mountFrame(entry) {
    var src = srcOf(entry);
    el.frameViewport.innerHTML = '';
    var frame = document.createElement('iframe');
    frame.setAttribute('data-for', entry.id);
    // 正式客户端必须允许鼠标点击页面内部（预览页那种 pointer-events:none 是测试台专属）
    frame.setAttribute('allow', 'fullscreen');
    frame.src = src;
    el.frameViewport.appendChild(frame);

    el.errorPanel.hidden = true;
    el.loadingPanel.hidden = false;
    el.loadingText.textContent = '正在加载大屏页面…';
    el.progress.style.width = '8%';

    var settled = false;
    clearTimeout(state.loadingTimer);
    state.loadingTimer = setTimeout(function () {
      if (settled) return;
      settled = true;
      showError('页面在 ' + Math.round(LOAD_TIMEOUT_MS / 1000) + ' 秒内没有加载完成。\n' +
        '若目标页面禁止被嵌入（X-Frame-Options）或需要登录，请尝试「用代理方式打开」。');
    }, LOAD_TIMEOUT_MS);

    frame.addEventListener('load', function () {
      settled = true;
      clearTimeout(state.loadingTimer);
      el.loadingPanel.hidden = true;
      el.progress.style.width = '100%';
      setTimeout(function () { el.progress.style.width = '0%'; }, 450);
      applyZoom();
      // 同源（代理模式）才能注入自动登录脚本；跨域时静默跳过
      tryAutoLogin(frame, entry);
    });
    applyZoom();
  }

  /** 代理模式下被代理页与客户端同源，可注入与电视端完全相同的 auto_login.js */
  function tryAutoLogin(frame, entry) {
    var al = entry.autoLogin;
    if (!al || al.enabled === false || !al.password) return;
    var win, doc;
    try { win = frame.contentWindow; doc = frame.contentDocument; } catch (e) { return; }
    if (!win || !doc || !doc.head) {
      if (openModeOf(entry) === 'direct') {
        showInfo('该页面需要登录：直连模式下浏览器不允许注入脚本，请手动登录一次；' +
          '或点击「代理模式」由服务端代理后自动填充账号密码。');
      }
      return;
    }
    // 代理已在 HTML 里注入过自动登录（服务端注入），客户端不再重复注入
    if (win.__TV_AUTOLOGIN_SERVER__) {
      showInfo('已注入自动登录脚本（账号 ' + (al.username || '—') + '）');
      return;
    }
    try {
      win.__TV_AUTOLOGIN__ = {
        enabled: true,
        username: String(al.username || ''),
        password: String(al.password || ''),
        usernameSelector: String(al.usernameSelector || ''),
        passwordSelector: String(al.passwordSelector || ''),
        submitSelector: String(al.submitSelector || ''),
        successSelector: String(al.successSelector || '')
      };
      win.__TV_AUTOLOGIN_DONE__ = false; // 每次导航后都允许重新注入
      var s = doc.createElement('script');
      s.textContent = AUTO_LOGIN_SRC;
      doc.head.appendChild(s);
      showInfo('已注入自动登录脚本（账号 ' + (al.username || '—') + '）');
    } catch (e) { /* 跨域或页面异常，忽略 */ }
  }

  function showInfo(extra) {
    if (!state.entry) return;
    var mode = openModeOf(state.entry) === 'proxy' ? '代理（同源）' : '直连';
    el.infoOverlay.textContent =
      state.entry.title + ' · ' + mode + ' · 缩放 ' + state.zoomPercent + '%' +
      (rotation.active ? ' · 轮询第 ' + (rotation.index + 1) + ' 页' : '') +
      (extra ? '\n' + extra : '');
    el.infoOverlay.style.whiteSpace = 'pre-line';
    el.infoOverlay.classList.add('show');
    clearTimeout(el.infoOverlay._t);
    el.infoOverlay._t = setTimeout(function () { el.infoOverlay.classList.remove('show'); }, 5200);
  }

  /** 虚拟 1920×1080 视口 + 等比缩放：与电视端「重写 WebView density」等价 */
  function applyZoom() {
    var box = el.frameBox.getBoundingClientRect();
    if (!box.width || !box.height) return;
    var autoFit = !state.entry || state.entry.autoFit !== false;
    var base = autoFit ? Math.min(box.width / ZONE_MIN.width, box.height / ZONE_MIN.height) : 1;
    var manual = state.entry && Number(state.entry.scale) > 0 ? Number(state.entry.scale) / 100 : 1;
    var k = base * manual * (state.zoomPercent / 100);
    el.frameViewport.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
    el.zoomChip.textContent = Math.round(k * 100) + '%';
  }

  function changeZoom(delta) {
    state.zoomPercent = Math.min(400, Math.max(25, state.zoomPercent + delta));
    applyZoom();
    showInfo();
  }

  function showError(message) {
    el.loadingPanel.hidden = true;
    el.errorMessage.textContent = message;
    el.errorPanel.hidden = false;
  }

  /**
   * 顶栏按钮组按模式切换：首页显示高频功能组，展示页显示画面控制组。
   * 原展示页独立工具条已取消，整行空间让给大屏画面。
   */
  function syncToolGroups() {
    var onDisplay = state.mode === 'display';
    var onCamera = state.mode === 'camera';
    el.homeTools.hidden = onDisplay || onCamera;
    el.displayTools.hidden = !onDisplay;
    el.cameraTools.hidden = !onCamera;
    if (onDisplay || onCamera) setMoreMenu(false);
    applyCtlLock(); // 模式切换后同步受控锁定态（锁定不作用于「设备控制」屏）
  }

  function reloadPage() {
    if (!state.entry) return;
    mountFrame(state.entry);
    toast('正在重新加载…');
  }

  /* ============================ 摄像头画面墙 ============================ */
  /*
   * 画面来源：服务端 /cam/<编号>.mjpg（ffmpeg 把 RTSP 的 H.265 转成 MJPEG）。
   * 选 MJPEG 是为了让 <img> 直接承载——浏览器与电视端 WebView 都原生支持，
   * 客户端不需要引入任何第三方播放库，也不会有本地插件的原生窗口错位问题。
   * 只给「当前可见」的画面发起连接；切布局时立即断开，服务端随即回收转码进程。
   */
  // cells：画面墙 9 格的排布（摄像头编号 / 'logo' / null），由服务端下发，
  // 与服务端按行合成的画面共用同一套顺序
  var camWall = { entry: null, list: [], cells: [], layout: 3, focus: 0, gen: 0 };
  /** 画面墙固定 3 列 × 3 行，与服务端 hstack 的每行路数保持一致 */
  var CAM_COLS = 3;
  var CAM_ROWS = 3;

  /** 点播地址；gen 每次切换布局自增，用于强制重连而不复用旧连接 */
  function camStreamUrl(id, high) {
    return SERVER_BASE + '/cam/' + id + '.mjpg' + (high ? '?q=high&' : '?') + 't=' + camWall.gen;
  }

  /** 一整行 3 路的合成画面地址（服务端 hstack）；3×3 墙面只用 3 条连接 */
  function camRowUrl(row) {
    return SERVER_BASE + '/cam/wall.mjpg?row=' + row + '&t=' + camWall.gen;
  }

  async function openCameraWall(entry) {
    camWall.entry = entry;
    state.mode = 'camera';
    state.entry = entry;
    el.homeScreen.hidden = true;
    el.displayScreen.hidden = true;
    el.zoneScreen.hidden = true;
    el.settingsScreen.hidden = true;
    el.cameraScreen.hidden = false;
    el.camGrid.className = 'layout-3';
    el.camGrid.innerHTML = '<div class="cam-hint">正在连接摄像头…</div>';
    syncToolGroups();
    camWall.layout = 3;
    camWall.focus = 0;
    camWall.gen++;
    await loadCameras();
    renderCamGrid();
    toast('方向键选择画面，【确定】放大，【M】切换 3×3 / 1×1');
  }

  async function loadCameras() {
    try {
      var res = await fetch(SERVER_BASE + '/api/cameras', { cache: 'no-store' });
      var data = await res.json();
      camWall.list = data && Array.isArray(data.cameras) ? data.cameras : [];
      camWall.cells = data && Array.isArray(data.cells) && data.cells.length
        ? data.cells
        // 服务端未下发排布时按顺序平铺，保证旧接口下依然能渲染
        : camWall.list.map(function (c) { return c.id; });
    } catch (e) {
      camWall.list = [];
      camWall.cells = [];
    }
  }

  function renderCamGrid() {
    var grid = el.camGrid;
    grid.innerHTML = '';
    grid.className = camWall.layout === 1 ? 'layout-1' : 'layout-3';
    if (!camWall.list.length) {
      grid.innerHTML = '<div class="cam-hint">没有可用的摄像头，请检查服务端 cameras 配置</div>';
      state.focusNodes = [];
      state.focus = null;
      return;
    }
    if (camWall.layout === 1) renderCamSingle();
    else renderCamWall();
    updateCamFocus();
    updateCamLayoutButton();
  }

  /** 当前高亮格对应的摄像头；品牌格/空位返回 null */
  function camAtFocus() {
    var cellId = camWall.cells[camWall.focus];
    for (var k = 0; typeof cellId === 'number' && k < camWall.list.length; k++) {
      if (camWall.list[k].id === cellId) return camWall.list[k];
    }
    return null;
  }

  /** 单画面：直接点播该摄像头的 MJPEG，取主码流看清细节 */
  function renderCamSingle() {
    // camWall.focus 是格子序号，品牌格占了位之后不能再直接当摄像头下标用
    var cam = camAtFocus() || camWall.list[0];
    var cell = document.createElement('div');
    cell.className = 'cam-cell' + (cam.online ? '' : ' offline');
    cell.setAttribute('data-id', String(cam.id));

    var img = document.createElement('img');
    img.alt = cam.title;
    // MJPEG 是长连接：服务端回收或网络抖动后需要重新点播才能续播
    img.addEventListener('error', function () {
      if (!img.isConnected) return;
      setTimeout(function () {
        if (img.isConnected) img.src = camStreamUrl(cam.id, true);
      }, 3000);
    });
    img.src = camStreamUrl(cam.id, true);
    cell.appendChild(img);

    var off = document.createElement('div');
    off.className = 'cam-off';
    off.textContent = '信号丢失';
    cell.appendChild(off);

    var badge = document.createElement('span');
    badge.className = 'cam-badge';
    badge.textContent = cam.online ? '在线' : '离线';
    cell.appendChild(badge);

    var name = document.createElement('div');
    name.className = 'cam-name';
    name.textContent = cam.title;
    cell.appendChild(name);

    cell.addEventListener('click', function () { setCameraLayout(3); });
    el.camGrid.appendChild(cell);

    state.focusNodes = [cell];
    state.focus = cell;
  }

  /**
   * 3×3 墙面：每行 3 路已由服务端拼成一条画面，这里叠一层 9 格浮层做
   * 名称/在线角标/高亮/点击放大，浮层本身透明，所以不会挡住画面。
   */
  function renderCamWall() {
    var rows = document.createElement('div');
    rows.id = 'camRows';
    for (var r = 1; r <= CAM_ROWS; r++) {
      var im = document.createElement('img');
      im.alt = '画面墙第 ' + r + ' 行';
      im.addEventListener('error', function () {
        var node = this;
        setTimeout(function () {
          if (node.isConnected) node.src = node.getAttribute('data-url');
        }, 3000);
      });
      im.setAttribute('data-url', camRowUrl(r));
      im.src = camRowUrl(r);
      rows.appendChild(im);
    }
    el.camGrid.appendChild(rows);

    var slots = document.createElement('div');
    slots.id = 'camSlots';
    for (var i = 0; i < CAM_ROWS * CAM_COLS; i++) {
      var cam = null;
      var cellId = camWall.cells[i];
      for (var k = 0; typeof cellId === 'number' && k < camWall.list.length; k++) {
        if (camWall.list[k].id === cellId) { cam = camWall.list[k]; break; }
      }
      var slot = document.createElement('div');
      slot.className = 'cam-slot' + (!cam ? '' : cam.online ? '' : ' offline');
      if (cam) slot.setAttribute('data-id', String(cam.id));
      // 品牌格：黑底 + 居中 logo，没有名称与在线角标（图片不在视频流里，见服务端注释）
      if (cellId === 'logo') {
        slot.className = 'cam-slot is-logo';
        var logo = document.createElement('img');
        logo.className = 'cam-logo';
        logo.alt = '中心标识';
        logo.src = SERVER_BASE + '/cam/logo.png';
        slot.appendChild(logo);
      }
      if (cam) {
        var off = document.createElement('div');
        off.className = 'cam-off';
        off.textContent = '信号丢失';
        slot.appendChild(off);

        var badge = document.createElement('span');
        badge.className = 'cam-badge';
        badge.textContent = cam.online ? '在线' : '离线';
        slot.appendChild(badge);

        var name = document.createElement('div');
        name.className = 'cam-name';
        // 带上序号，方便对着遥控器定位
        name.textContent = cam.id + '. ' + cam.title;
        slot.appendChild(name);
      }
      (function (target, entry, cellIndex) {
        if (entry) {
          target.addEventListener('click', function () {
            // 存格子序号：切回 3×3 时高亮才能落回原格（品牌格占了位，
            // 格子序号与 camWall.list 下标不再一一对应）
            camWall.focus = cellIndex;
            setCameraLayout(1);
          });
        }
        target.addEventListener('mouseenter', function () {
          state.focus = target;
          updateCamFocus();
        });
      })(slot, cam, i);
      slots.appendChild(slot);
    }
    el.camGrid.appendChild(slots);

    var nodes = Array.prototype.slice.call(slots.querySelectorAll('.cam-slot'));
    state.focusNodes = nodes;
    state.focus = nodes[Math.min(camWall.focus, nodes.length - 1)] || null;
  }

  /** 切换 3×3 / 1×1：先断开旧连接，服务端空闲回收后 CPU 立刻回落 */
  function setCameraLayout(n) {
    camWall.layout = n === 1 ? 1 : 3;
    camWall.gen++;
    Array.prototype.forEach.call(el.camGrid.querySelectorAll('img'), function (img) {
      img.removeAttribute('src');
      img.src = '';
    });
    renderCamGrid();
  }

  function updateCamFocus() {
    state.focusNodes.forEach(function (node) {
      node.classList.toggle('focused', node === state.focus);
    });
  }

  function updateCamLayoutButton() {
    if (el.btnCamLayout) el.btnCamLayout.textContent = '布局：' + (camWall.layout === 1 ? '1×1' : '3×3');
  }

  function moveCamFocus(dx, dy) {
    if (camWall.layout === 1) return;
    var i = state.focusNodes.indexOf(state.focus);
    if (i < 0) i = 0;
    var col = (i % 3) + dx;
    var row = Math.floor(i / 3) + dy;
    if (col < 0 || col > 2) return;
    var next = row * 3 + col;
    if (next < 0 || next >= state.focusNodes.length) return;
    camWall.focus = next;
    state.focus = state.focusNodes[next];
    updateCamFocus();
  }

  /** 【确定】键：宫格 → 放大单画面；单画面 → 回到宫格 */
  function activateCamFocus() {
    // 高亮在品牌格/空位上时没有可放大的画面，保持宫格不动
    if (camWall.layout === 3 && !camAtFocus()) return;
    setCameraLayout(camWall.layout === 1 ? 3 : 1);
  }

  async function refreshCameraWall() {
    camWall.gen++;
    Array.prototype.forEach.call(el.camGrid.querySelectorAll('img'), function (img) {
      img.removeAttribute('src');
      img.src = '';
    });
    await loadCameras();
    renderCamGrid();
    toast('画面已重新连接');
  }

  function closeCameraWall() {
    Array.prototype.forEach.call(el.camGrid.querySelectorAll('img'), function (img) {
      img.removeAttribute('src');
      img.src = '';
    });
    el.camGrid.innerHTML = '';
    el.cameraScreen.hidden = true;
    camWall.entry = null;
    camWall.list = [];
    camWall.cells = [];
  }

  function backToHome() {
    stopRotation();
    if (state.mode === 'camera') closeCameraWall();
    clearInterval(ctlPanel.timer); // 离开设备控制屏时停止列表轮询
    ctlPanel.timer = null;
    state.mode = 'home';
    state.entry = null;
    el.frameViewport.innerHTML = '';
    el.displayScreen.hidden = true;
    el.zoneScreen.hidden = true;
    el.cameraScreen.hidden = true;
    el.settingsScreen.hidden = true;
    el.controlScreen.hidden = true;
    el.homeScreen.hidden = false;
    syncToolGroups();
    renderHome();
    focusFirst();
  }

  function toggleMode() {
    if (!state.entry) return;
    var entry = state.entry;
    local.proxyModes[entry.id] = openModeOf(entry) === 'proxy' ? 'direct' : 'proxy';
    saveLocalSettings();
    renderModeButton();
    mountFrame(entry);
    toast('已切换为「' + (openModeOf(entry) === 'proxy' ? '代理模式' : '直连模式') + '」');
  }

  function openInTab() {
    if (!state.entry) return;
    window.open(state.entry.url, '_blank', 'noopener');
  }

  /* ============================ 轮询展示 ============================ */

  function rotationIntervalMs() {
    return Math.max(1, Number(local.rotation.intervalSec) || 15) * 1000;
  }

  function rotationEntries() {
    // 配了「强制原址打开」的入口无法内嵌轮播（会不停弹新标签），跳过；
    // 画面墙经服务端 /cam/view 画面墙网页同样参与轮播
    return local.rotation.items.map(function (id) { return entryOf(id); })
      .filter(function (e) { return e && e.openOriginal !== true; });
  }

  /** 由本机时钟起点推导当前是第几页：退出重进不跳页，多端一致 */
  function rotationIndexFromClock(n) {
    if (n <= 0) return 0;
    var start = Number(local.rotation.startedAt) || 0;
    if (!start) return 0;
    var elapsed = Math.max(0, correctedNow() - start);
    return Math.floor(elapsed / rotationIntervalMs()) % n;
  }

  function startRotation() {
    if (!ENTRIES.length) { toast('暂无可轮询的页面，请先在管理后台添加页面'); return; }
    var usable = local.rotation.items.filter(function (id) { return !!entryOf(id); });
    if (!usable.length) {
      // 进入即播放：首次没选过就让全部页面参与
      local.rotation.items = ENTRIES.map(function (e) { return e.id; });
      local.rotation.startedAt = correctedNow();
      saveLocalSettings();
    }
    var list = rotationEntries();
    if (!list.length) { toast('暂无可轮询的页面，请先在管理后台添加页面'); return; }
    rotation.active = true;
    rotation.paused = false;
    rotation.index = rotationIndexFromClock(list.length);
    el.rotationChip.classList.add('show');
    openEntry(list[rotation.index], { rotation: true });
    renderRotationChip();
    scheduleRotation();
    toast('轮询播放中：共 ' + list.length + ' 页，每页 ' + (rotationIntervalMs() / 1000) + ' 秒');
  }

  function stopRotation() {
    rotation.active = false;
    rotation.paused = false;
    clearTimeout(rotation.advanceTimer);
    clearInterval(rotation.tickTimer);
    el.rotationChip.classList.remove('show');
  }

  function scheduleRotation() {
    clearTimeout(rotation.advanceTimer);
    clearInterval(rotation.tickTimer);
    if (!rotation.active) return;
    rotation.tickTimer = setInterval(renderRotationChip, 1000);
    if (rotation.paused) return;
    var list = rotationEntries();
    if (list.length < 1) return;
    var iv = rotationIntervalMs();
    var start = Number(local.rotation.startedAt) || correctedNow();
    var remain = iv - ((correctedNow() - start) % iv);
    rotation.advanceTimer = setTimeout(function () {
      rotation.index = (rotation.index + 1) % list.length;
      openEntry(list[rotation.index], { rotation: true });
      scheduleRotation();
    }, remain);
  }

  function toggleRotationPause() {
    if (!rotation.active) return;
    if (rotation.paused) {
      rotation.paused = false;
      // 恢复时把时钟起点对齐到当前页，避免「暂停期间时间仍在走」导致跳页
      local.rotation.startedAt = correctedNow() - rotation.index * rotationIntervalMs();
      saveLocalSettings();
      scheduleRotation();
      toast('已继续轮询');
    } else {
      rotation.paused = true;
      clearTimeout(rotation.advanceTimer);
      clearInterval(rotation.tickTimer);
      el.btnRotationToggle.textContent = '继续';
      toast('已暂停轮询');
    }
    renderRotationChip();
  }

  function renderRotationChip() {
    if (!rotation.active) return;
    var list = rotationEntries();
    var iv = rotationIntervalMs();
    var start = Number(local.rotation.startedAt) || correctedNow();
    var remain = rotation.paused ? 0 : (iv - ((correctedNow() - start) % iv));
    el.btnRotationToggle.textContent = rotation.paused ? '继续' : '暂停';
    el.rotationText.textContent = '轮询播放中 · 第 ' + (rotation.index + 1) + '/' + list.length + ' 页' +
      (rotation.paused ? '（已暂停）' : ' · ' + Math.max(0, Math.ceil(remain / 1000)) + 's 后切换');
  }

  /* ============================ 分区展示 2×2 ============================ */

  function zoneEntries() {
    return [0, 1, 2, 3].map(function (pos) {
      var z = local.zones.filter(function (x) { return x.position === pos; })[0];
      return z && z.entryId ? entryOf(z.entryId) : null;
    });
  }

  /** 构建单格（抽出以便「只重建一格」，避免其余三格 iframe 重新加载） */
  function buildZoneCell(entry, position) {
    var cell = document.createElement('div');
    cell.className = 'zone-cell';
    cell.setAttribute('data-pos', String(position));

    var label = document.createElement('div');
    label.className = 'zone-label';
    var idx = document.createElement('b');
    idx.textContent = String(position + 1);
    var name = document.createElement('span');
    name.className = 'zname';
    name.textContent = entry ? entry.title : '未配置';
    var pos = document.createElement('span');
    pos.className = 'zpos';
    var pick = document.createElement('button');
    pick.className = 'zbtn';
    pick.textContent = '选择页面';
    pick.addEventListener('click', function (ev) {
      ev.stopPropagation();
      zones.active = position;
      updateZoneActive();
      pickZoneEntry(position);
    });
    var openBtn = document.createElement('button');
    openBtn.className = 'zbtn';
    openBtn.textContent = '单独打开';
    openBtn.disabled = !entry;
    openBtn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (entry) openEntry(entry);
    });
    pos.appendChild(pick);
    pos.appendChild(openBtn);
    label.appendChild(idx);
    label.appendChild(name);
    label.appendChild(pos);
    label.addEventListener('click', function () {
      zones.active = position;
      updateZoneActive();
      pickZoneEntry(position);
    });
    cell.appendChild(label);

    var body = document.createElement('div');
    body.className = 'zone-body';
    if (!entry) {
      var ph = document.createElement('div');
      ph.className = 'zone-placeholder';
      ph.textContent = '未配置 · 点击「选择页面」为该格指定大屏';
      body.appendChild(ph);
    } else {
      var vp = document.createElement('div');
      vp.className = 'zone-viewport';
      var frame = document.createElement('iframe');
      frame.src = srcOf(entry);
      frame.setAttribute('data-for', entry.id);
      // 不设 referrerpolicy：代理模式下服务端要靠 Referer 兜底「脚本跳转丢前缀」的情况
      vp.appendChild(frame);
      body.appendChild(vp);
    }
    cell.appendChild(body);

    var flash = document.createElement('div');
    flash.className = 'zone-flash';
    cell.appendChild(flash);
    return cell;
  }

  /** 只切换「当前分区」的逻辑状态，不重建 DOM —— 否则每次移动都会重载四个页面 */
  function updateZoneActive() {
    Array.prototype.forEach.call(el.zoneGrid.querySelectorAll('.zone-cell'), function (cell) {
      var p = Number(cell.getAttribute('data-pos'));
      cell.className = 'zone-cell' + (p === zones.active ? ' active' : '');
    });
  }

  /** 高亮某格：立即点亮，holdMs 后淡出（position < 0 表示全部熄灭） */
  function flashZone(position, holdMs) {
    if (holdMs === undefined) holdMs = 600;
    clearTimeout(zones.flashTimer);
    zones.flashTimer = null;
    Array.prototype.forEach.call(el.zoneGrid.querySelectorAll('.zone-cell'), function (cell) {
      var glow = cell.querySelector('.zone-flash');
      if (!glow) return;
      if (Number(cell.getAttribute('data-pos')) === position) glow.classList.add('on');
      else glow.classList.remove('on');
    });
    if (position < 0 || holdMs <= 0) return;
    zones.flashTimer = setTimeout(function () { flashZone(-1, 0); }, holdMs);
  }

  function scaleZoneCells() {
    Array.prototype.forEach.call(el.zoneGrid.querySelectorAll('.zone-cell'), function (cell) {
      var body = cell.querySelector('.zone-body');
      var vp = cell.querySelector('.zone-viewport');
      if (!body || !vp) return;
      var r = body.getBoundingClientRect();
      if (!r.width) return;
      var k = r.width / ZONE_MIN.width;
      vp.style.transform = 'scale(' + k + ')';
    });
  }

  function renderZones() {
    el.zoneGrid.innerHTML = '';
    zoneEntries().forEach(function (entry, position) {
      el.zoneGrid.appendChild(buildZoneCell(entry, position));
    });
    updateZoneActive();
    updateZoneHint();
    scaleZoneCells();
    flashZone(zones.active);
  }

  /** 只有该格内容真的变了才调用：其余三格的 iframe 保持不动 */
  function renderZoneCell(position) {
    var old = el.zoneGrid.querySelector('.zone-cell[data-pos="' + position + '"]');
    if (!old) return;
    el.zoneGrid.replaceChild(buildZoneCell(zoneEntries()[position] || null, position), old);
    updateZoneHint();
    updateZoneActive();
    scaleZoneCells();
    flashZone(position);
  }

  function updateZoneHint() {
    var configured = zoneEntries().filter(Boolean).length;
    el.zoneHint.textContent = configured
      ? '点击分区或按 Enter 为该格选择页面　方向键移动高亮　每格按 ' + ZONE_MIN.width + '×' + ZONE_MIN.height + ' 渲染'
      : '点击任一格「选择页面」开始配置 2×2 拼接';
  }

  function moveZone(rowDelta, colDelta) {
    var row = Math.min(1, Math.max(0, Math.floor(zones.active / 2) + rowDelta));
    var col = Math.min(1, Math.max(0, (zones.active % 2) + colDelta));
    var next = row * 2 + col;
    if (next === zones.active) return;
    zones.active = next;
    updateZoneActive();   // 仅换逻辑状态，不重载四个页面
    flashZone(next);      // 目标格亮一下即淡出
    var entry = zoneEntries()[next];
    toast('当前分区：' + (entry ? entry.title : '第 ' + (next + 1) + ' 格（未配置）'));
  }

  function pickZoneEntry(position) {
    flashZone(position);
    // 画面墙经服务端 /cam/view 画面墙网页同样可在分格内嵌播放
    var items = ENTRIES.map(function (e) {
      var cur = local.zones.filter(function (z) { return z.position === position; })[0];
      return {
        text: e.title,
        primary: !!(cur && cur.entryId === e.id),
        run: function () { setZoneEntry(position, e.id); }
      };
    });
    items.push({ text: '不使用（清空该格）', run: function () { setZoneEntry(position, ''); } });
    openDialog('选择第 ' + (position + 1) + ' 格的页面',
      '2×2 拼接，每格按 ' + ZONE_MIN.width + '×' + ZONE_MIN.height + ' 渲染', items, 'Esc 取消');
  }

  function setZoneEntry(position, entryId) {
    local.zones = local.zones.map(function (z) {
      return z.position === position ? { position: position, entryId: entryId } : z;
    });
    saveLocalSettings();
    renderZoneCell(position);
    var entry = entryId ? entryOf(entryId) : null;
    toast('第 ' + (position + 1) + ' 格已设为：' + (entry ? entry.title : '不使用'));
  }

  function openZones() {
    stopRotation();
    state.mode = 'zones';
    state.entry = null;
    el.homeScreen.hidden = true;
    el.displayScreen.hidden = true;
    el.settingsScreen.hidden = true;
    el.zoneScreen.hidden = false;
    renderZones();
  }

  /* ============================ 设置 ============================ */

  function openSettings() {
    stopRotation();
    state.mode = 'settings';
    el.homeScreen.hidden = true;
    el.displayScreen.hidden = true;
    el.zoneScreen.hidden = true;
    el.settingsScreen.hidden = false;
    renderSettings();
  }

  function renderSettings() {
    var host = el.settingsList;
    host.innerHTML = '';

    /* --- 轮询 --- */
    var c1 = card('轮询展示', '进入「轮询展示」即开始播放；这里设置是否开机自动播放、停留时间与参与页面。改动后从第 1 页重新计时。');
    c1.appendChild(rowSwitch('开机自动播放', '打开客户端后自动进入轮询播放', local.rotation.enabled, function (v) {
      local.rotation.enabled = v;
      afterRotationChange();
    }));
    c1.appendChild(rowInterval());
    c1.appendChild(rowSection('参与轮询的页面（勾选加入，↑↓ 调整播放顺序）'));
    if (!ENTRIES.length) c1.appendChild(rowNote('暂无页面，请先在管理后台添加。'));
    ENTRIES.forEach(function (e, i) {
      c1.appendChild(rowRotationPage(e, i));
    });
    host.appendChild(c1);

    /* --- 电脑端 --- */
    var c2 = card('电脑端偏好', '这些设置只影响本机浏览器，不会同步到服务端与电视端。');
    c2.appendChild(rowSwitch('关闭页面时确认', '对应电视端的「退出确认」，关闭标签页时浏览器会再问一次', local.exitGuard, function (v) {
      local.exitGuard = v;
      saveLocalSettings();
      markSettingsSaved();
    }));
    c2.appendChild(rowNote('退出确认文案（由服务端下发）：' + (CFG.exitTip || '—')));
    c2.appendChild(rowButton('清除本机展示设置', '仅清空本机的轮询与分区配置，不影响服务端内容', '清除', function () {
      local.rotation = { enabled: false, intervalSec: 15, items: [], startedAt: 0 };
      local.zones = [0, 1, 2, 3].map(function (p) { return { position: p, entryId: '' }; });
      local.proxyModes = {};
      saveLocalSettings();
      renderSettings();
      markSettingsSaved();
      toast('已清除本机展示设置');
    }));
    host.appendChild(c2);

    /* --- 关于 --- */
    var c3 = card('关于', '电脑浏览器客户端与电视端共用同一份服务端内容，展示策略各自保存在本机。');
    c3.appendChild(rowNote('服务端地址：' + (SERVER_BASE || location.origin)));
    c3.appendChild(rowNote('配置来源：' + (source === 'server' ? '服务器 v' + CFG.version + '（epoch ' + CFG.epoch + '）' : '内置兜底内容')));
    c3.appendChild(rowNote('页面数：' + ENTRIES.length + '　轮询页数：' + rotationEntries().length));
    c3.appendChild(rowNote('同步协议：GET /api/config?since=<version>&epoch=<epoch>，无变更返回 304；代次变化自动降级全量。'));
    host.appendChild(c3);
  }

  function card(title, desc) {
    var c = document.createElement('div');
    c.className = 'settings-card';
    var h = document.createElement('h3');
    h.textContent = title;
    var p = document.createElement('p');
    p.className = 'desc';
    p.textContent = desc;
    c.appendChild(h);
    c.appendChild(p);
    return c;
  }

  function rowSection(text) {
    var d = document.createElement('div');
    d.style.cssText = 'color:var(--muted);font-size:12px;margin:14px 0 6px';
    d.textContent = text;
    return d;
  }

  function rowNote(text) {
    var d = document.createElement('div');
    d.style.cssText = 'color:var(--muted);font-size:12px;line-height:1.7;padding:4px 10px';
    d.textContent = text;
    return d;
  }

  function rowSwitch(label, hint, value, onChange) {
    var r = document.createElement('div');
    r.className = 'row';
    var l = document.createElement('div');
    l.className = 'rlabel';
    l.textContent = label;
    var small = document.createElement('small');
    small.textContent = hint;
    l.appendChild(small);
    var sw = document.createElement('div');
    sw.className = 'switch' + (value ? ' on' : '');
    sw.addEventListener('click', function () {
      var next = !sw.classList.contains('on');
      sw.classList.toggle('on', next);
      onChange(next);
    });
    r.appendChild(l);
    r.appendChild(sw);
    return r;
  }

  function rowInterval() {
    var r = document.createElement('div');
    r.className = 'row';
    var l = document.createElement('div');
    l.className = 'rlabel';
    l.textContent = '每页停留时间';
    var sel = document.createElement('select');
    INTERVAL_PRESETS.forEach(function (s) {
      var o = document.createElement('option');
      o.value = String(s);
      o.textContent = s + ' 秒';
      if (s === local.rotation.intervalSec) o.selected = true;
      sel.appendChild(o);
    });
    if (INTERVAL_PRESETS.indexOf(local.rotation.intervalSec) < 0) {
      var o2 = document.createElement('option');
      o2.value = String(local.rotation.intervalSec);
      o2.textContent = local.rotation.intervalSec + ' 秒（自定义）';
      o2.selected = true;
      sel.appendChild(o2);
    }
    sel.addEventListener('change', function () {
      local.rotation.intervalSec = Math.min(3600, Math.max(1, parseInt(sel.value, 10) || 15));
      afterRotationChange();
    });
    r.appendChild(l);
    r.appendChild(sel);
    return r;
  }

  function rowRotationPage(entry, index) {
    var r = document.createElement('div');
    r.className = 'row';
    var l = document.createElement('div');
    l.className = 'rlabel';
    l.textContent = entry.title;
    var small = document.createElement('small');
    var at = local.rotation.items.indexOf(entry.id);
    small.textContent = at >= 0 ? ('第 ' + (at + 1) + ' 位 / 共 ' + local.rotation.items.length + ' 页') : '未加入轮询';
    l.appendChild(small);

    var up = document.createElement('button');
    up.className = 'mini-btn';
    up.textContent = '↑';
    up.disabled = at <= 0;
    up.addEventListener('click', function () { reorderRotation(entry.id, -1); });

    var down = document.createElement('button');
    down.className = 'mini-btn';
    down.textContent = '↓';
    down.disabled = at < 0 || at >= local.rotation.items.length - 1;
    down.addEventListener('click', function () { reorderRotation(entry.id, 1); });

    var toggle = document.createElement('button');
    toggle.className = 'mini-btn';
    toggle.style.minWidth = '52px';
    toggle.textContent = at >= 0 ? '移出' : '加入';
    toggle.addEventListener('click', function () {
      var items = local.rotation.items.slice();
      var i = items.indexOf(entry.id);
      if (i >= 0) items.splice(i, 1);
      else items.push(entry.id);
      local.rotation.items = items;
      afterRotationChange();
    });

    r.appendChild(l);
    r.appendChild(up);
    r.appendChild(down);
    r.appendChild(toggle);
    return r;
  }

  function rowButton(label, hint, btnText, onClick) {
    var r = document.createElement('div');
    r.className = 'row';
    var l = document.createElement('div');
    l.className = 'rlabel';
    l.textContent = label;
    var small = document.createElement('small');
    small.textContent = hint;
    l.appendChild(small);
    var b = document.createElement('button');
    b.className = 'btn';
    b.textContent = btnText;
    b.addEventListener('click', onClick);
    r.appendChild(l);
    r.appendChild(b);
    return r;
  }

  function reorderRotation(id, dir) {
    var items = local.rotation.items.slice();
    var from = items.indexOf(id);
    if (from < 0) return;
    var to = Math.min(items.length - 1, Math.max(0, from + dir));
    if (to === from) return;
    items.splice(from, 1);
    items.splice(to, 0, id);
    local.rotation.items = items;
    afterRotationChange();
  }

  /** 轮询设置变化后重置本机时钟起点并立即生效（对应电视端 saveRotation 的 restartClock） */
  function afterRotationChange() {
    local.rotation.startedAt = correctedNow();
    saveLocalSettings();
    renderSettings();
    markSettingsSaved();
    if (rotation.active) { rotation.index = 0; scheduleRotation(); renderRotationChip(); }
  }

  function markSettingsSaved() {
    el.settingsState.textContent = '已保存';
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function () { el.settingsState.textContent = ''; }, 1600);
  }

  /* ============================ 通用弹层 ============================ */

  function openDialog(title, subtitle, items, footer, onCancel) {
    dialog.open = true;
    dialog.items = items || [];
    dialog.focus = Math.max(0, items.findIndex ? items.findIndex(function (i) { return i.primary; }) : -1);
    if (dialog.focus < 0) dialog.focus = 0;
    dialog.onCancel = onCancel || null;

    el.dialogLayer.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'dialog';
    var head = document.createElement('header');
    var h = document.createElement('h3');
    h.textContent = title;
    head.appendChild(h);
    if (subtitle) {
      var p = document.createElement('p');
      p.textContent = subtitle;
      head.appendChild(p);
    }
    var list = document.createElement('div');
    list.className = 'list';
    box.appendChild(head);
    box.appendChild(list);
    if (footer) {
      var f = document.createElement('footer');
      f.textContent = footer;
      box.appendChild(f);
    }
    el.dialogLayer.appendChild(box);
    el.dialogLayer.hidden = false;
    renderDialogItems(list);
  }
  function renderDialogItems(list) {
    list.innerHTML = '';
    dialog.items.forEach(function (item, i) {
      var d = document.createElement('div');
      d.className = 'item' + (i === dialog.focus ? ' focused' : '') + (item.primary ? ' primary' : '');
      var dot = document.createElement('span');
      dot.className = 'dot';
      var t = document.createElement('span');
      t.textContent = item.text;
      d.appendChild(dot);
      d.appendChild(t);
      d.addEventListener('mouseenter', function () {
        dialog.focus = i;
        setDialogFocus(list, i);   // 只换高亮：重建 DOM 会让 mousedown/mouseup 落在不同节点上，click 就不再派发到条目上
      });
      d.addEventListener('click', function () { closeDialog(); item.run && item.run(); });
      list.appendChild(d);
    });
  }

  function setDialogFocus(list, index) {
    Array.prototype.forEach.call(list.children, function (n, k) {
      n.classList.toggle('focused', k === index);
    });
  }

  function closeDialog() {
    dialog.open = false;
    dialog.items = [];
    el.dialogLayer.hidden = true;
    el.dialogLayer.innerHTML = '';
  }

  /* ============================ 全屏演示模式 ============================ */

  function isFullscreen() { return !!document.fullscreenElement; }

  function toggleFullscreen() {
    if (isFullscreen()) {
      document.exitFullscreen().catch(function () { /* 忽略 */ });
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function (e) {
        toast('浏览器拒绝了全屏请求：' + e.message);
      });
    } else {
      toast('当前浏览器不支持全屏 API，可用 F11');
    }
  }

  function syncFullscreenButton() {
    el.btnFullscreen.textContent = isFullscreen() ? '退出全屏' : '全屏';
    el.btnFullscreen.classList.toggle('on', isFullscreen());
    setTimeout(applyZoom, 120); // 全屏切换后容器尺寸变了，重算缩放
    setTimeout(scaleZoneCells, 120);
  }
  document.addEventListener('fullscreenchange', syncFullscreenButton);

  window.addEventListener('beforeunload', function (e) {
    if (CFG.exitConfirm && local.exitGuard) {
      e.preventDefault();
      e.returnValue = CFG.exitTip || '';
      return CFG.exitTip || '';
    }
    return undefined;
  });

  /* ============================ 菜单（对应电视端【菜单】键） ============================ */

  function showHomeMenu() {
    openDialog('主菜单', '内容由服务端维护，展示策略保存在本机', [
      { text: '立即同步配置', run: function () { syncFromServer(true); } },
      { text: '轮询展示', run: function () { startRotation(); } },
      { text: '分区展示（2×2 拼接）', run: function () { openZones(); } },
      { text: '设置', run: function () { openSettings(); } },
      { text: '全屏演示模式', run: function () { toggleFullscreen(); } },
      { text: '关闭', primary: true, run: function () { } }
    ], 'M 打开菜单　Enter 确认　Esc 关闭');
  }

  function showDisplayMenu() {
    /* 只保留顶栏画面控制组没有的功能（缩放/模式切换/原址打开/返回首页均与顶栏按钮重复，已删除） */
    var items = [];
    if (rotation.active) items.push({ text: '暂停 / 继续轮询', run: function () { toggleRotationPause(); } });
    items.push({ text: '轮询设置', run: function () { openSettings(); } });
    items.push({ text: '设备控制', run: function () { openControl(); } });
    items.push({ text: '刷新页面', run: function () { reloadPage(); } });
    openDialog('控制菜单 · ' + state.entry.title, null, items, 'M 打开菜单　Esc 关闭');
  }

  function showZoneMenu() {
    openDialog('分区展示 · 2×2 拼接', null, [
      { text: '刷新全部页面', run: function () { renderZones(); toast('已刷新全部页面'); } },
      { text: '在单页模式打开当前分区', run: function () {
        var e = zoneEntries()[zones.active];
        if (e) openEntry(e); else toast('该分区尚未配置页面');
      } },
      { text: '返回首页', run: function () { backToHome(); } }
    ], '方向键 移动高亮　Enter 为该格选页　每格按 ' + ZONE_MIN.width + '×' + ZONE_MIN.height + ' 渲染');
  }

  /* ============================ 键盘 ============================ */

  document.addEventListener('keydown', function (e) {
    var key = e.key;

    /* 远程被控时锁定全部展示快捷操作（设计 §8.1）：唯一本地出口是顶栏模式开关（鼠标点击）。
       例外：指令到达前已打开的菜单弹窗允许用 Esc 关闭，否则界面被卡住。 */
    if (!ctl.localMode) {
      if (dialog.open && key === 'Escape') { e.preventDefault(); closeDialog(); return; }
      e.preventDefault();
      var now = Date.now();
      if (now - ctl.lastLockToast > 5000) {
        ctl.lastLockToast = now;
        toast('远程被控中 · 点顶栏开关（本地控制）交还本机操作');
      }
      return;
    }

    if (dialog.open) {
      if (key === 'Escape') { e.preventDefault(); var cb = dialog.onCancel; closeDialog(); cb && cb(); return; }
      if (key === 'ArrowDown' || key === 'ArrowUp') {
        e.preventDefault();
        dialog.focus = Math.min(dialog.items.length - 1, Math.max(0, dialog.focus + (key === 'ArrowDown' ? 1 : -1)));
        var list = el.dialogLayer.querySelector('.list');
        if (list) setDialogFocus(list, dialog.focus);
        return;
      }
      if (key === 'Enter') {
        e.preventDefault();
        var item = dialog.items[dialog.focus];
        closeDialog();
        item && item.run && item.run();
        return;
      }
      return;
    }

    if (key === 'F11') return; // 交给浏览器

    if (key === 'f' || key === 'F') { e.preventDefault(); toggleFullscreen(); return; }
    if (key === 'm' || key === 'M') {
      e.preventDefault();
      if (state.mode === 'display') showDisplayMenu();
      else if (state.mode === 'zones') showZoneMenu();
      else if (state.mode === 'camera') setCameraLayout(camWall.layout === 1 ? 3 : 1);
      else if (state.mode === 'home') showHomeMenu();
      return;
    }
    if (key === 'Escape') {
      e.preventDefault();
      // 配置弹层（轮询/分屏/改名）打开时，Esc 只关弹层，不离开控制屏
      if (ctlPanel.modalOpen) { closeCtlModal(); return; }
      // 二级菜单打开时，Esc 只收菜单，不改变当前页面
      if (!el.moreMenu.hidden) { setMoreMenu(false); return; }
      if (state.mode === 'settings') backToHome();
      else if (state.mode === 'control') closeControl();
      else if (state.mode !== 'home') backToHome();
      return;
    }

    if (state.mode === 'home') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveFocus(-1, 0); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveFocus(1, 0); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveFocus(0, -1); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveFocus(0, 1); }
      else if (key === 'Enter') {
        e.preventDefault();
        var node = state.focus;
        if (node) {
          var entry = entryOf(node.getAttribute('data-id'));
          if (entry) openEntry(entry);
        }
      }
      return;
    }

    if (state.mode === 'zones') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveZone(0, -1); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveZone(0, 1); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveZone(-1, 0); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveZone(1, 0); }
      else if (key === 'Enter') { e.preventDefault(); pickZoneEntry(zones.active); }
      return;
    }

    if (state.mode === 'camera') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveCamFocus(-1, 0); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveCamFocus(1, 0); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveCamFocus(0, -1); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveCamFocus(0, 1); }
      else if (key === 'Enter') { e.preventDefault(); activateCamFocus(); }
      else if (key === 'r' || key === 'R') { e.preventDefault(); refreshCameraWall(); }
      return;
    }

    if (state.mode === 'display') {
      if (key === 'r' || key === 'R') { e.preventDefault(); reloadPage(); }
      else if (key === '+' || key === '=') { e.preventDefault(); changeZoom(10); }
      else if (key === '-' || key === '_') { e.preventDefault(); changeZoom(-10); }
      else if (key === '0') { e.preventDefault(); state.zoomPercent = 100; applyZoom(); showInfo(); }
      else if (key === ' ') { e.preventDefault(); if (rotation.active) toggleRotationPause(); }
    }
  });

  /* ============================ 事件绑定 ============================ */

  el.btnSync.addEventListener('click', function () { syncFromServer(true); });
  el.btnTurbo.addEventListener('click', toggleTurbo);
  el.btnRotation.addEventListener('click', startRotation);
  el.btnZones.addEventListener('click', openZones);
  el.btnSettings.addEventListener('click', openSettings);
  el.btnFullscreen.addEventListener('click', toggleFullscreen);

  /* 「更多」二级菜单：点击开合；点菜单项后自动收起；点页面别处或按 Esc 也收起 */
  function setMoreMenu(open) {
    el.moreMenu.hidden = !open;
    el.btnMore.setAttribute('aria-expanded', open ? 'true' : 'false');
    el.btnMore.classList.toggle('on', open);
  }
  el.btnMore.addEventListener('click', function (e) {
    e.stopPropagation();
    setMoreMenu(el.moreMenu.hidden);
  });
  el.moreMenu.addEventListener('click', function (e) {
    // 菜单里的链接/按钮被点中后收起（链接是新标签打开，不影响当前页）
    if (e.target.closest('.menu-item')) setMoreMenu(false);
  });
  document.addEventListener('click', function (e) {
    if (!el.moreMenu.hidden && !el.moreMenu.contains(e.target) && e.target !== el.btnMore) setMoreMenu(false);
  });
  el.btnBack.addEventListener('click', backToHome);
  el.btnBack2.addEventListener('click', backToHome);
  el.btnZoneBack.addEventListener('click', backToHome);
  el.btnSettingsBack.addEventListener('click', backToHome);
  el.btnRetry.addEventListener('click', reloadPage);
  el.btnMenu.addEventListener('click', showDisplayMenu);
  el.btnUseProxy.addEventListener('click', function () {
