<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大屏聚合平台 · 设备控制</title>
<!--
  多设备互控 · 独立控制台（docs/远程控制台-设计方案.md §11 修订版）

  - 纯控制端：本页面不注册为受控设备、不心跳，只调用 /api/ctl/* 接口；
    打开它的平板/电脑永远不会被自己下发的指令锁住。
  - 显示端（站点首页 /，或电视 APK 1.8）负责接收指令切换画面。
  - 单文件、无框架无 CDN，与 admin/index.html 同风格，由服务端 18080 托管在 /console。
-->
<style>
:root {
  --bg: #0b1220; --panel: #1a2432; --panel2: #223048;
  --line: rgba(255,255,255,.14); --text: #f3f7ff;
  --muted: #a9bdd8; --accent: #2FD2F5;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 14px; flex: none;
  padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgba(13,21,36,.9);
}
header h1 { font-size: 19px; }
header .sub { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
.btn {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: rgba(47,210,245,.5); }
.btn.primary { background: rgba(47,210,245,.16); border-color: rgba(47,210,245,.55); color: #bfeeff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.apply { border-color: rgba(63,224,166,.45); color: #7df0c0; }
.btn.apply::before { content: '▶ '; font-size: 10px; }
a.btn { text-decoration: none; display: inline-block; }

.scenes {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none;
  padding: 10px 22px; border-bottom: 1px solid var(--line);
}
.scenes .label { font-size: 12px; color: var(--muted); flex: none; }
.scenes .list { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

main { flex: 1; overflow: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 10px; }
.card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.card .ck { width: 20px; height: 20px; flex: none; accent-color: var(--accent); cursor: pointer; }
.card .kind {
  flex: none; width: 46px; text-align: center; font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 0;
}
.card .main { flex: 1; min-width: 0; }
.card .nm { display: flex; align-items: center; gap: 8px; }
.card .nm b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .st { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #56617a; }
.dot.online { background: #3FE0A6; }
.dot.recent { background: #FFB020; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 11px; }
.chip.remote { color: #9fe7ff; border-color: rgba(47,210,245,.5); background: rgba(47,210,245,.1); }
.chip.local { color: #7df0c0; border-color: rgba(63,224,166,.4); }
.chip.pending { color: #FFB020; border-color: rgba(255,176,32,.5); }
.card .ops { display: flex; gap: 6px; flex: none; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.card .ops .btn { padding: 5px 10px; font-size: 12px; }
.card .ops select {
  background: rgba(9,16,28,.9); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 8px; font-size: 12px; max-width: 150px;
}
.card .ops .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 26px; text-align: center; }

footer {
  flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 22px; border-top: 1px solid var(--line); background: rgba(13,21,36,.9);
}
footer .sel-info { font-size: 12px; color: var(--muted); margin-right: auto; }
footer select {
  background: rgba(9,16,28,.9); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: 13px; max-width: 200px;
}

/* 弹层（确认 / 轮询 / 分屏 / 改名） */
#mask {
  position: fixed; inset: 0; z-index: 50; background: rgba(4,8,16,.66);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#mask[hidden] { display: none; }
.modal {
  width: min(560px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.6); overflow: hidden;
}
.modal header { padding: 16px 18px 10px; background: none; border: none; }
.modal header h3 { font-size: 16px; }
.modal header p { margin-top: 5px; color: var(--muted); font-size: 12px; }
.modal .body { padding: 4px 16px 12px; overflow: auto; }
.modal .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: 13px; }
.modal .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal label { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.modal select, .modal input[type="text"] {
  background: rgba(9,16,28,.9); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; font-size: 14px;
}
.modal select { font-size: 13px; }
.modal .zonegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 0; }
.modal .zonegrid .zg { display: flex; flex-direction: column; gap: 6px; }
.modal .zonegrid .zg span { font-size: 12px; color: var(--muted); }
.modal .zonegrid select { width: 100%; }
.modal footer {
  display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  padding: 12px 18px; border-top: 1px solid var(--line); background: none;
}
.confirm-list { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 16px; }
.confirm-btn {
  padding: 12px; text-align: center; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel2); font-size: 14px;
}
.confirm-btn.primary { background: rgba(47,210,245,.16); border-color: rgba(47,210,245,.55); color: #bfeeff; }
.confirm-btn:hover { border-color: rgba(47,210,245,.5); }

#toast {
  position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 14px); z-index: 60;
  background: rgba(9,16,28,.96); border: 1px solid rgba(47,210,245,.4); color: #ddf2ff;
  padding: 11px 18px; border-radius: 10px; font-size: 13px; max-width: 74vw;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 900px) {
  header { flex-wrap: wrap; }
  .card { flex-wrap: wrap; }
  .card .ops { max-width: 100%; }
}
</style>
</head>
<body>

<header>
  <h1>设备控制</h1>
  <span class="sub" id="serverChip">连接服务端…</span>
  <span class="spacer"></span>
  <a class="btn" href="/" target="_blank" rel="noopener">显示端首页 ↗</a>
  <a class="btn" href="/setting" target="_blank" rel="noopener">管理 ↗</a>
  <button class="btn" id="btnReload" title="立即刷新设备列表">刷新</button>
</header>

<div class="scenes">
  <span class="label">场景</span>
  <span class="list" id="sceneList"></span>
  <button class="btn" id="btnSceneSave" title="把当前全场设备的状态保存为一个场景，之后可一键恢复">＋ 存为场景…</button>
  <button class="btn" id="btnSceneManage" title="场景重命名 / 删除">管理…</button>
</div>

<main id="deviceList"></main>

<footer>
  <span class="sel-info" id="selInfo">未勾选设备</span>
  <select id="selEntry"><option value="">显示页面…</option></select>
  <button class="btn" id="btnRotate">轮询…</button>
  <button class="btn" id="btnZone">2×2 分屏…</button>
  <button class="btn" id="btnHome">回首页</button>
  <button class="btn" id="btnRelease">取消控制</button>
  <button class="btn" id="btnRefreshCmd">刷新当前页</button>
  <button class="btn" id="btnSync">强制同步</button>
  <button class="btn" id="btnAll">全选 / 清空</button>
</footer>

<div id="mask" hidden><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============================ 基础工具 ============================ */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    serverChip: $('serverChip'), btnReload: $('btnReload'), sceneList: $('sceneList'),
    btnSceneSave: $('btnSceneSave'), btnSceneManage: $('btnSceneManage'),
    deviceList: $('deviceList'), selInfo: $('selInfo'), selEntry: $('selEntry'),
    btnRotate: $('btnRotate'), btnZone: $('btnZone'), btnHome: $('btnHome'),
    btnRelease: $('btnRelease'), btnRefreshCmd: $('btnRefreshCmd'),
    btnSync: $('btnSync'), btnAll: $('btnAll'), mask: $('mask'),
    modalBox: $('modalBox'), toast: $('toast')
  };

  var state = { devices: [], scenes: [], entries: [], selected: {} };

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(els.toast._t);
    els.toast._t = setTimeout(function () { els.toast.classList.remove('show'); }, 2400);
  }

  async function api(method, path, body) {
    var res = await fetch(path, {
      method: method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    var json = null;
    try { json = await res.json(); } catch (e) { /* 非 JSON */ }
    if (!res.ok) throw new Error(json && json.error ? json.error : 'HTTP ' + res.status);
    return json;
  }

  /* ============================ 弹层 ============================ */

  function closeModal() { els.mask.hidden = true; els.modalBox.innerHTML = ''; }
  els.mask.addEventListener('click', function (e) { if (e.target === els.mask) closeModal(); });

  /** 简易确认弹层：buttons = [{text, primary, run}]（第一个为默认视觉焦点） */
  function confirmModal(title, message, buttons) {
    els.modalBox.innerHTML = '';
    var h = document.createElement('header');
    h.innerHTML = '<h3></h3>';
    h.querySelector('h3').textContent = title;
    if (message) {
      var p = document.createElement('p');
      p.textContent = message;
      h.appendChild(p);
    }
    var list = document.createElement('div');
    list.className = 'confirm-list';
    buttons.forEach(function (b) {
      var d = document.createElement('div');
      d.className = 'confirm-btn' + (b.primary ? ' primary' : '');
      d.textContent = b.text;
      d.addEventListener('click', function () { closeModal(); b.run && b.run(); });
      list.appendChild(d);
    });
    els.modalBox.appendChild(h);
    els.modalBox.appendChild(list);
    els.mask.hidden = false;
  }

  /** 表单弹层：build(body, footer) 填充内容 */
  function formModal(title, subtitle, build) {
    els.modalBox.innerHTML = '';
    var h = document.createElement('header');
    var h3 = document.createElement('h3');
    h3.textContent = title;
    h.appendChild(h3);
    if (subtitle) {
      var p = document.createElement('p');
      p.textContent = subtitle;
      h.appendChild(p);
    }
    var body = document.createElement('div');
    body.className = 'body';
    var foot = document.createElement('footer');
    els.modalBox.appendChild(h);
    els.modalBox.appendChild(body);
    els.modalBox.appendChild(foot);
    els.mask.hidden = false;
    build(body, foot);
  }

  /* ============================ 数据刷新 ============================ */

  async function refresh() {
    try {
      var json = await api('GET', '/api/ctl/devices');
      state.devices = json.devices || [];
      state.scenes = json.scenes || [];
      els.serverChip.textContent = '· ' + state.devices.length + ' 台设备';
      renderDevices();
      renderScenes();
    } catch (e) {
      els.serverChip.textContent = '服务端不可达';
    }
  }

  async function refreshEntries() {
    try {
      var cfg = await api('GET', '/api/admin/config');
      state.entries = cfg.entries || [];
      renderEntryOptions();
      renderDevices(); // 卡片上的「显示页面」下拉跟随最新页面列表
    } catch (e) { /* 下拉沿用旧列表 */ }
  }

  function entryOf(id) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === id) return state.entries[i];
    return null;
  }

  function renderEntryOptions() {
    var sel = els.selEntry;
    sel.innerHTML = '<option value="">显示页面…</option>';
    state.entries.forEach(function (e) {
      var o = document.createElement('option');
      o.value = e.id;
      o.textContent = e.title;
      sel.appendChild(o);
    });
  }

  /* ============================ 设备列表 ============================ */

  function summary(d) {
    var r = d.reported;
    if (!r) return '暂无上报';
    function t(id) { var e = id && entryOf(id); return e ? e.title : (id || '—'); }
    if (r.mode === 'home') return '首页';
    if (r.mode === 'page') return '显示：' + t(r.entryId);
    if (r.mode === 'camera') return '画面墙：' + t(r.entryId);
    if (r.mode === 'rotate' && r.rotate) {
      return '轮询 ' + (Number(r.rotate.index) + 1) + '/' + r.rotate.total + ' · ' + r.rotate.intervalSec + 's';
    }
    if (r.mode === 'zone' && r.zone && r.zone.slots) {
      return '分屏：' + r.zone.slots.map(function (s) { return s ? t(s).slice(0, 6) : '—'; }).join(' / ');
    }
    if (r.mode === 'settings') return '本机设置';
    return r.mode || '—';
  }

  function renderDevices() {
    var host = els.deviceList;
    // 用户正在卡片下拉里选页面时跳过本轮重渲染（3s 自动刷新不打断操作，下一轮再刷）
    var ae = document.activeElement;
    if (ae && ae.tagName === 'SELECT' && host.contains(ae)) return;
    host.innerHTML = '';
    if (!state.devices.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '还没有设备注册 —— 用电脑或平板打开显示端首页（/），或在电视上安装 1.8 客户端后，会自动出现在这里';
      host.appendChild(e);
      renderSelInfo();
      return;
    }
    state.devices.forEach(function (d) {
      var card = document.createElement('div');
      card.className = 'card';

      var ck = document.createElement('input');
      ck.type = 'checkbox';
      ck.className = 'ck';
      ck.checked = !!state.selected[d.id];
      ck.addEventListener('change', function () {
        if (ck.checked) state.selected[d.id] = true;
        else delete state.selected[d.id];
        renderSelInfo();
      });
      card.appendChild(ck);

      var kind = document.createElement('div');
      kind.className = 'kind';
      kind.textContent = d.kind === 'tv' ? 'TV' : d.kind === 'tablet' ? '平板' : 'PC';
      card.appendChild(kind);

      var main = document.createElement('div');
      main.className = 'main';
      var nm = document.createElement('div');
      nm.className = 'nm';
      var b = document.createElement('b');
      b.textContent = d.name;
      nm.appendChild(b);
      main.appendChild(nm);

      var st = document.createElement('div');
      st.className = 'st';
      var dot = document.createElement('span');
      dot.className = 'dot ' + d.online;
      dot.title = d.online === 'online' ? '在线' : d.online === 'recent' ? '刚离线' : '离线';
      var mode = document.createElement('span');
      mode.className = 'chip ' + (d.managed ? 'remote' : 'local');
      mode.textContent = d.managed ? '远程被控' : '本地控制';
      var sm = document.createElement('span');
      sm.textContent = summary(d);
      st.appendChild(dot);
      st.appendChild(mode);
      if (d.pending) {
        var pend = document.createElement('span');
        pend.className = 'chip pending';
        pend.textContent = '待送达';
        st.appendChild(pend);
      }
      if (d.reported && d.reported.lastError) {
        var err = document.createElement('span');
        err.className = 'chip pending';
        err.textContent = d.reported.lastError;
        st.appendChild(err);
      }
      st.appendChild(sm);
      main.appendChild(st);
      card.appendChild(main);

      var ops = document.createElement('div');
      ops.className = 'ops';
      // 单台快捷操作（对这张卡片直接下发，无需勾选；勾选集操作在底部操作条）
      var sel = document.createElement('select');
      sel.className = 'entry-sel';
      var defOpt = document.createElement('option');
      defOpt.value = '';
      defOpt.textContent = '显示页面…';
      sel.appendChild(defOpt);
      state.entries.forEach(function (e) {
        var o = document.createElement('option');
        o.value = e.id;
        o.textContent = e.title;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        if (!sel.value) return;
        sendCmd('show', { entryId: sel.value }, [d.id]);
        sel.value = '';
      });
      ops.appendChild(sel);
      ['轮询…', '分屏…'].forEach(function (label) {
        var b = document.createElement('button');
        b.className = 'btn';
        b.textContent = label;
        b.addEventListener('click', function () {
          if (label === '轮询…') rotateDialog([d.id]);
          else zoneDialog([d.id]);
        });
        ops.appendChild(b);
      });
      var rel = document.createElement('button');
      rel.className = 'btn';
      rel.textContent = '取消控制';
      rel.addEventListener('click', function () { releaseCmd([d.id]); });
      ops.appendChild(rel);

      var sep = document.createElement('span');
      sep.className = 'sep';
      ops.appendChild(sep);

      var rn = document.createElement('button');
      rn.className = 'btn';
      rn.textContent = '改名';
      rn.addEventListener('click', function () { renameDialog(d); });
      var boot = document.createElement('button');
      boot.className = 'btn';
      boot.textContent = '开机恢复：' + (d.bootRestore ? '开' : '关');
      boot.title = '受控状态下设备重启后自动回到设定画面';
      boot.addEventListener('click', function () { setBootRestore(d, !d.bootRestore); });
      ops.appendChild(rn);
      ops.appendChild(boot);
      card.appendChild(ops);

      host.appendChild(card);
    });
    renderSelInfo();
  }

  function renderSelInfo() {
    var n = Object.keys(state.selected).length;
    els.selInfo.textContent = n
      ? '已勾选 ' + n + ' 台设备（对勾选设备执行以下操作）'
      : '未勾选设备（先勾选，或点「全选」）';
  }

  function targets() {
    var ids = Object.keys(state.selected);
    return ids.length ? ids : null;
  }

  /* ============================ 下发操作 ============================ */

  /**
   * 下发指令。explicit 传入时对指定设备单台下发（卡片快捷操作）；
   * 否则作用于底部操作条的勾选集。
   */
  async function sendCmd(cmd, args, explicit) {
    var t = explicit || targets();
    if (!t) { toast('请先勾选目标设备'); return false; }
    try {
      var json = await api('POST', '/api/ctl/send', { targets: t, cmd: cmd, args: args || {} });
      toast('已下发「' + cmd + '」→ ' + json.results.length + ' 台设备（≤3 秒生效）');
      refresh();
      return true;
    } catch (e) {
      toast('下发失败：' + e.message);
      return false;
    }
  }

  /** 取消控制（退出远程被控一律二次确认）；explicit = 单台，否则勾选集 */
  function releaseCmd(explicit) {
    var t = explicit || targets();
    if (!t) { toast('请先勾选目标设备'); return; }
    confirmModal('取消控制？', (t.length) + ' 台设备将退出远程被控、恢复本地操作（画面保持不变）。', [
      { text: '继续控制', run: function () {} },
      { text: '取消控制，交还本地', primary: true, run: async function () {
        try {
          var json = await api('POST', '/api/ctl/release', { targets: t });
          toast('已交还 ' + json.results.length + ' 台设备');
        } catch (e) { toast('操作失败：' + e.message); }
        refresh();
      } }
    ]);
  }

  /* ---------- 轮询弹层 ---------- */

  var rotateDraft = [];
  var INTERVAL_PRESETS = [5, 10, 15, 20, 30, 45, 60, 120, 300];

  /** 轮询弹层：explicit = 单台目标（卡片快捷），否则勾选集（底部操作条） */
  function rotateDialog(explicit) {
    if (!explicit && !targets()) { toast('请先勾选目标设备'); return; }
    rotateDraft = [];
    var targetName = explicit ? (state.devices.find(function (d) { return d.id === explicit[0]; }) || {}).name : null;
    formModal('轮询下发', (targetName ? '目标：' + targetName + '。' : '') +
      '勾选参与页面（↑↓ 调整顺序），确定后立即开始轮询', function (body, foot) {
      var rowIv = document.createElement('div');
      rowIv.className = 'row';
      var lb = document.createElement('label');
      lb.appendChild(document.createTextNode('每页停留'));
      var selIv = document.createElement('select');
      INTERVAL_PRESETS.forEach(function (s) {
        var o = document.createElement('option');
        o.value = String(s);
        o.textContent = s + ' 秒';
        selIv.appendChild(o);
      });
      selIv.value = '15';
      lb.appendChild(selIv);
      rowIv.appendChild(lb);

      var rowSync = document.createElement('div');
      rowSync.className = 'row';
      var lb2 = document.createElement('label');
      var ckSync = document.createElement('input');
      ckSync.type = 'checkbox';
      ckSync.checked = false; // 多屏同步切换默认关（评审决议）
      lb2.appendChild(ckSync);
      var sp = document.createElement('span');
      sp.textContent = '多屏同步切换（各设备翻页时机一致，依赖内网时钟）';
      lb2.appendChild(sp);
      rowSync.appendChild(lb2);

      var listBox = document.createElement('div');
      function renderRows() {
        listBox.innerHTML = '';
        state.entries.forEach(function (e) {
          var idx = rotateDraft.indexOf(e.id);
          var row = document.createElement('div');
          row.className = 'row';
          var ck = document.createElement('input');
          ck.type = 'checkbox';
          ck.checked = idx >= 0;
          ck.addEventListener('change', function () {
            if (ck.checked) rotateDraft.push(e.id);
            else rotateDraft = rotateDraft.filter(function (x) { return x !== e.id; });
            renderRows();
          });
          var name = document.createElement('span');
          name.className = 'grow';
          name.textContent = (idx >= 0 ? (idx + 1) + '. ' : '') + e.title;
          row.appendChild(ck);
          row.appendChild(name);
          if (idx >= 0) {
            ['↑', '↓'].forEach(function (dir) {
              var btn = document.createElement('button');
              btn.className = 'btn';
              btn.style.padding = '3px 10px';
              btn.textContent = dir;
              btn.addEventListener('click', function () {
                var j = dir === '↑' ? idx - 1 : idx + 1;
                if (j < 0 || j >= rotateDraft.length) return;
                var tmp = rotateDraft[idx];
                rotateDraft[idx] = rotateDraft[j];
                rotateDraft[j] = tmp;
                renderRows();
              });
              row.appendChild(btn);
            });
          }
          listBox.appendChild(row);
        });
      }
      renderRows();

      body.appendChild(rowIv);
      body.appendChild(rowSync);
      body.appendChild(listBox);

      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', closeModal);
      var ok = document.createElement('button');
      ok.className = 'btn primary';
      ok.textContent = '下发轮询';
      ok.addEventListener('click', function () {
        if (!rotateDraft.length) { toast('请至少勾选一个页面'); return; }
        if (sendCmd('rotate', {
          intervalSec: Number(selIv.value),
          items: rotateDraft.slice(),
          phaseSync: ckSync.checked
        }, explicit)) closeModal();
      });
      foot.appendChild(cancel);
      foot.appendChild(ok);
    });
  }

  /* ---------- 分屏弹层 ---------- */

  /** 分屏弹层：explicit = 单台目标（卡片快捷），否则勾选集 */
  function zoneDialog(explicit) {
    if (!explicit && !targets()) { toast('请先勾选目标设备'); return; }
    var draft = [null, null, null, null];
    formModal('2×2 分屏下发', '为四个分区各指定页面（或「不使用」），确定后进入分屏', function (body, foot) {
      var grid = document.createElement('div');
      grid.className = 'zonegrid';
      draft.forEach(function (_, pos) {
        var cell = document.createElement('div');
        cell.className = 'zg';
        var sp = document.createElement('span');
        sp.textContent = '第 ' + (pos + 1) + ' 格';
        var sel = document.createElement('select');
        var none = document.createElement('option');
        none.value = '';
        none.textContent = '不使用';
        sel.appendChild(none);
        state.entries.forEach(function (e) {
          var o = document.createElement('option');
          o.value = e.id;
          o.textContent = e.title;
          sel.appendChild(o);
        });
        sel.addEventListener('change', function () { draft[pos] = sel.value || null; });
        cell.appendChild(sp);
        cell.appendChild(sel);
        grid.appendChild(cell);
      });
      body.appendChild(grid);

      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', closeModal);
      var ok = document.createElement('button');
      ok.className = 'btn primary';
      ok.textContent = '下发分屏';
      ok.addEventListener('click', function () {
        if (!draft.some(function (s) { return s; })) { toast('至少为一格指定页面'); return; }
        if (sendCmd('zone', { slots: draft.slice() }, explicit)) closeModal();
      });
      foot.appendChild(cancel);
      foot.appendChild(ok);
    });
  }

  /* ---------- 改名 / 开机恢复 ---------- */

  function renameDialog(d) {
    formModal('设备改名', d.id, function (body, foot) {
      var row = document.createElement('div');
      row.className = 'row';
      var input = document.createElement('input');
      input.type = 'text';
      input.value = d.name;
      input.maxLength = 60;
      input.style.flex = '1';
      row.appendChild(input);
      body.appendChild(row);
      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', closeModal);
      var ok = document.createElement('button');
      ok.className = 'btn primary';
      ok.textContent = '保存';
      ok.addEventListener('click', async function () {
        var name = input.value.trim();
        if (!name) { toast('设备名不能为空'); return; }
        try {
          await api('PUT', '/api/ctl/device/' + encodeURIComponent(d.id), { name: name });
          toast('已改名：' + name);
        } catch (e) { toast('改名失败：' + e.message); }
        closeModal();
        refresh();
      });
      foot.appendChild(cancel);
      foot.appendChild(ok);
      setTimeout(function () { input.focus(); }, 50);
    });
  }

  async function setBootRestore(d, value) {
    try {
      await api('PUT', '/api/ctl/device/' + encodeURIComponent(d.id), { bootRestore: value });
      toast(d.name + ' 开机恢复：' + (value ? '开' : '关'));
    } catch (e) { toast('操作失败：' + e.message); }
    refresh();
  }

  /* ============================ 场景 ============================ */

  function renderScenes() {
    var host = els.sceneList;
    host.innerHTML = '';
    if (!state.scenes.length) {
      var tip = document.createElement('span');
      tip.style.cssText = 'font-size:12px;color:var(--muted);';
      tip.textContent = '暂无场景 —— 把全场调到某个状态后点「＋ 存为场景」';
      host.appendChild(tip);
      return;
    }
    state.scenes.forEach(function (s) {
      var btn = document.createElement('button');
      btn.className = 'btn apply';
      btn.textContent = s.name + '（' + s.steps.length + '）';
      btn.title = '一键把 ' + s.steps.length + ' 台设备恢复到该场景（离线设备会补投递）';
      btn.addEventListener('click', async function () {
        try {
          var json = await api('POST', '/api/ctl/scenes/' + encodeURIComponent(s.id) + '/apply');
          var skipped = json.total - json.applied;
          toast('场景「' + s.name + '」已下发 ' + json.applied + '/' + json.total +
            (skipped ? '（' + skipped + ' 台设备已移除，跳过）' : ''));
          refresh();
        } catch (e) { toast('应用失败：' + e.message); }
      });
      host.appendChild(btn);
    });
  }

  function saveSceneDialog() {
    var online = state.devices.filter(function (d) { return d.online !== 'offline'; }).length;
    if (!online) { toast('当前没有在线设备，无法保存场景'); return; }
    formModal('存为场景', '将捕获 ' + online + ' 台在线设备的当前状态（正在控制的设备记指令，本地设备记当前画面）', function (body, foot) {
      var row = document.createElement('div');
      row.className = 'row';
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '场景名（如：晨会 / 来访 / 值守）';
      input.maxLength = 60;
      input.style.flex = '1';
      row.appendChild(input);
      body.appendChild(row);
      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', closeModal);
      var ok = document.createElement('button');
      ok.className = 'btn primary';
      ok.textContent = '保存';
      ok.addEventListener('click', async function () {
        var name = input.value.trim();
        if (!name) { toast('请输入场景名'); return; }
        try {
          var json = await api('POST', '/api/ctl/scenes', { name: name });
          var note = json.skipped && json.skipped.length ? '（' + json.skipped.length + ' 台离线设备未入场景）' : '';
          toast('场景「' + name + '」已保存：' + json.scene.steps.length + ' 步' + note);
        } catch (e) { toast('保存失败：' + e.message); }
        closeModal();
        refresh();
      });
      foot.appendChild(cancel);
      foot.appendChild(ok);
      setTimeout(function () { input.focus(); }, 50);
    });
  }

  function sceneManageDialog() {
    if (!state.scenes.length) { toast('还没有场景'); return; }
    formModal('场景管理', '重命名或删除已保存的场景', function (body, foot) {
      state.scenes.forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'row';
        var name = document.createElement('span');
        name.className = 'grow';
        name.textContent = s.name + '（' + s.steps.length + ' 步）';
        row.appendChild(name);
        var rn = document.createElement('button');
        rn.className = 'btn';
        rn.style.padding = '5px 10px';
        rn.textContent = '重命名';
        rn.addEventListener('click', function () { renameSceneDialog(s); });
        var del = document.createElement('button');
        del.className = 'btn';
        del.style.padding = '5px 10px';
        del.textContent = '删除';
        del.addEventListener('click', function () {
          confirmModal('删除场景「' + s.name + '」？', '删除后不可恢复。', [
            { text: '保留', run: function () {} },
            { text: '删除', primary: true, run: async function () {
              try {
                await api('DELETE', '/api/ctl/scenes/' + encodeURIComponent(s.id));
                toast('已删除场景「' + s.name + '」');
              } catch (e) { toast('删除失败：' + e.message); }
              refresh();
            } }
          ]);
        });
        row.appendChild(rn);
        row.appendChild(del);
        body.appendChild(row);
      });
      var close = document.createElement('button');
      close.className = 'btn';
      close.textContent = '关闭';
      close.addEventListener('click', closeModal);
      foot.appendChild(close);
    });
  }

  function renameSceneDialog(scene) {
    formModal('场景重命名', scene.id, function (body, foot) {
      var row = document.createElement('div');
      row.className = 'row';
      var input = document.createElement('input');
      input.type = 'text';
      input.value = scene.name;
      input.maxLength = 60;
      input.style.flex = '1';
      row.appendChild(input);
      body.appendChild(row);
      var cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', closeModal);
      var ok = document.createElement('button');
      ok.className = 'btn primary';
      ok.textContent = '保存';
      ok.addEventListener('click', async function () {
        var name = input.value.trim();
        if (!name) { toast('场景名不能为空'); return; }
        try {
          await api('PUT', '/api/ctl/scenes/' + encodeURIComponent(scene.id), { name: name });
          toast('已重命名：' + name);
        } catch (e) { toast('重命名失败：' + e.message); }
        closeModal();
        refresh();
      });
      foot.appendChild(cancel);
      foot.appendChild(ok);
      setTimeout(function () { input.focus(); }, 50);
    });
  }

  /* ============================ 事件绑定与启动 ============================ */

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !els.mask.hidden) closeModal();
  });
  els.btnReload.addEventListener('click', refresh);
  els.selEntry.addEventListener('change', function () {
    var id = els.selEntry.value;
    if (!id) return;
    sendCmd('show', { entryId: id });
    els.selEntry.value = '';
  });
  els.btnRotate.addEventListener('click', function () { rotateDialog(); });
  els.btnZone.addEventListener('click', function () { zoneDialog(); });
  els.btnHome.addEventListener('click', function () { sendCmd('home'); });
  els.btnRelease.addEventListener('click', function () { releaseCmd(); });
  els.btnRefreshCmd.addEventListener('click', function () { sendCmd('refresh'); });
  els.btnSync.addEventListener('click', function () { sendCmd('sync'); });
  els.btnAll.addEventListener('click', function () {
    var allOn = state.devices.length && state.devices.every(function (d) { return state.selected[d.id]; });
    state.selected = {};
    if (!allOn) state.devices.forEach(function (d) { state.selected[d.id] = true; });
    renderDevices();
  });
  els.btnSceneSave.addEventListener('click', saveSceneDialog);
  els.btnSceneManage.addEventListener('click', sceneManageDialog);

  refreshEntries();
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
