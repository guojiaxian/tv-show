    saveLocalSettings();
    renderSettings();
    markSettingsSaved();
    if (rotation.active) { rotation.index = 0; scheduleRotation(); renderRotationChip(); }
  }

  function markSettingsSaved() {
    el.settingsState.textContent = '已保存';
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function () { el.settingsState.textContent = ''; }, 1600);
  }

  /* ============================ 通用弹层 ============================ */

  function openDialog(title, subtitle, items, footer, onCancel) {
    dialog.open = true;
    dialog.items = items || [];
    dialog.focus = Math.max(0, items.findIndex ? items.findIndex(function (i) { return i.primary; }) : -1);
    if (dialog.focus < 0) dialog.focus = 0;
    dialog.onCancel = onCancel || null;

    el.dialogLayer.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'dialog';
    var head = document.createElement('header');
    var h = document.createElement('h3');
    h.textContent = title;
    head.appendChild(h);
    if (subtitle) {
      var p = document.createElement('p');
      p.textContent = subtitle;
      head.appendChild(p);
    }
    var list = document.createElement('div');
    list.className = 'list';
    box.appendChild(head);
    box.appendChild(list);
    if (footer) {
      var f = document.createElement('footer');
      f.textContent = footer;
      box.appendChild(f);
    }
    el.dialogLayer.appendChild(box);
    el.dialogLayer.hidden = false;
    renderDialogItems(list);
  }
  function renderDialogItems(list) {
    list.innerHTML = '';
    dialog.items.forEach(function (item, i) {
      var d = document.createElement('div');
      d.className = 'item' + (i === dialog.focus ? ' focused' : '') + (item.primary ? ' primary' : '');
      var dot = document.createElement('span');
      dot.className = 'dot';
      var t = document.createElement('span');
      t.textContent = item.text;
      d.appendChild(dot);
      d.appendChild(t);
      d.addEventListener('mouseenter', function () {
        dialog.focus = i;
        setDialogFocus(list, i);   // 只换高亮：重建 DOM 会让 mousedown/mouseup 落在不同节点上，click 就不再派发到条目上
      });
      d.addEventListener('click', function () { closeDialog(); item.run && item.run(); });
      list.appendChild(d);
    });
  }

  function setDialogFocus(list, index) {
    Array.prototype.forEach.call(list.children, function (n, k) {
      n.classList.toggle('focused', k === index);
    });
  }

  function closeDialog() {
    dialog.open = false;
    dialog.items = [];
    el.dialogLayer.hidden = true;
    el.dialogLayer.innerHTML = '';
  }

  /* ============================ 全屏演示模式 ============================ */

  function isFullscreen() { return !!document.fullscreenElement; }

  function toggleFullscreen() {
    if (isFullscreen()) {
      document.exitFullscreen().catch(function () { /* 忽略 */ });
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function (e) {
        toast('浏览器拒绝了全屏请求：' + e.message);
      });
    } else {
      toast('当前浏览器不支持全屏 API，可用 F11');
    }
  }

  function syncFullscreenButton() {
    var fs = isFullscreen();
    el.btnFullscreen.textContent = fs ? '退出全屏' : '全屏';
    el.btnFullscreen.classList.toggle('on', fs);
    if (el.btnDisplayFullscreen) {
      el.btnDisplayFullscreen.textContent = fs ? '退出全屏' : '全屏';
      el.btnDisplayFullscreen.classList.toggle('on', fs);
    }
    setTimeout(applyZoom, 120); // 全屏切换后容器尺寸变了，重算缩放
    setTimeout(scaleZoneCells, 120);
  }
  document.addEventListener('fullscreenchange', syncFullscreenButton);
  document.addEventListener('fullscreenchange', syncTopbarVisibility);

  /**
   * 真全屏：进入全屏（按钮 / F）或 F11（浏览器外壳全屏，无法监听事件，
   * 用 outerHeight - innerHeight < 50 启发式识别）时隐藏顶栏，画面占满整屏；
   * 退出（Esc / F11）自动恢复。每次显隐后重算缩放。
   */
  function isFsLike() {
    if (isFullscreen()) return true;
    // 自动化环境（无头浏览器）没有浏览器外壳，outer==inner 恒成立，启发式失真——直接排除
    if (navigator.webdriver) return false;
    return window.outerHeight > 0 && window.innerHeight > 0 &&
      window.outerHeight - window.innerHeight < 50;
  }
  var topbarFsState = false;
  function syncTopbarVisibility() {
    var fs = isFsLike();
    if (fs === topbarFsState) return;
    topbarFsState = fs;
    document.body.classList.toggle('fs-mode', fs);
    setTimeout(function () { applyZoom(); scaleZoneCells(); }, 150);
  }
  window.addEventListener('resize', syncTopbarVisibility);

  window.addEventListener('beforeunload', function (e) {
    if (CFG.exitConfirm && local.exitGuard) {
      e.preventDefault();
      e.returnValue = CFG.exitTip || '';
      return CFG.exitTip || '';
    }
    return undefined;
  });

  /* ============================ 菜单（对应电视端【菜单】键） ============================ */

  function showHomeMenu() {
    openDialog('主菜单', '内容由服务端维护，展示策略保存在本机', [
      { text: '立即同步配置', run: function () { syncFromServer(true); } },
      { text: '轮询展示', run: function () { startRotation(); } },
      { text: '分区展示（2×2 拼接）', run: function () { openZones(); } },
      { text: '设置', run: function () { openSettings(); } },
      { text: '全屏演示模式', run: function () { toggleFullscreen(); } },
      { text: '关闭', primary: true, run: function () { } }
    ], 'M 打开菜单　Enter 确认　Esc 关闭');
  }

  function showDisplayMenu() {
    /* 只保留顶栏画面控制组没有的功能（缩放/模式切换/原址打开/返回首页均与顶栏按钮重复，已删除） */
    var items = [];
    if (rotation.active) items.push({ text: '暂停 / 继续轮询', run: function () { toggleRotationPause(); } });
    items.push({ text: '轮询设置', run: function () { openSettings(); } });
    items.push({ text: '刷新页面', run: function () { reloadPage(); } });
    openDialog('控制菜单 · ' + state.entry.title, null, items, 'M 打开菜单　Esc 关闭');
  }

  function showZoneMenu() {
    openDialog('分区展示 · 2×2 拼接', null, [
      { text: '刷新全部页面', run: function () { renderZones(); toast('已刷新全部页面'); } },
      { text: '在单页模式打开当前分区', run: function () {
        var e = zoneEntries()[zones.active];
        if (e) openEntry(e); else toast('该分区尚未配置页面');
      } },
      { text: '返回首页', run: function () { backToHome(); } }
    ], '方向键 移动高亮　Enter 为该格选页　每格按 ' + ZONE_MIN.width + '×' + ZONE_MIN.height + ' 渲染');
  }

  /* ============================ 键盘 ============================ */

  document.addEventListener('keydown', function (e) {
    var key = e.key;

    if (dialog.open) {
      if (key === 'Escape') { e.preventDefault(); var cb = dialog.onCancel; closeDialog(); cb && cb(); return; }
      if (key === 'ArrowDown' || key === 'ArrowUp') {
        e.preventDefault();
        dialog.focus = Math.min(dialog.items.length - 1, Math.max(0, dialog.focus + (key === 'ArrowDown' ? 1 : -1)));
        var list = el.dialogLayer.querySelector('.list');
        if (list) setDialogFocus(list, dialog.focus);
        return;
      }
      if (key === 'Enter') {
        e.preventDefault();
        var item = dialog.items[dialog.focus];
        closeDialog();
        item && item.run && item.run();
        return;
      }
      return;
    }

    if (key === 'F11') return; // 交给浏览器

    if (key === 'f' || key === 'F') { e.preventDefault(); toggleFullscreen(); return; }
    if (key === 'm' || key === 'M') {
      e.preventDefault();
      if (state.mode === 'display') showDisplayMenu();
      else if (state.mode === 'zones') showZoneMenu();
      else if (state.mode === 'camera') setCameraLayout(camWall.layout === 1 ? 3 : 1);
      else if (state.mode === 'home') showHomeMenu();
      return;
    }
    if (key === 'Escape') {
      e.preventDefault();
      // 二级菜单打开时，Esc 只收菜单，不改变当前页面
      if (!el.moreMenu.hidden) { setMoreMenu(false); return; }
      if (state.mode === 'settings') backToHome();
      else if (state.mode !== 'home') backToHome();
      return;
    }

    if (state.mode === 'home') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveFocus(-1, 0); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveFocus(1, 0); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveFocus(0, -1); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveFocus(0, 1); }
      else if (key === 'Enter') {
        e.preventDefault();
        var node = state.focus;
        if (node) {
          var entry = entryOf(node.getAttribute('data-id'));
          if (entry) openEntry(entry);
        }
      }
      return;
    }

    if (state.mode === 'zones') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveZone(0, -1); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveZone(0, 1); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveZone(-1, 0); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveZone(1, 0); }
      else if (key === 'Enter') { e.preventDefault(); pickZoneEntry(zones.active); }
      return;
    }

    if (state.mode === 'camera') {
      if (key === 'ArrowLeft') { e.preventDefault(); moveCamFocus(-1, 0); }
      else if (key === 'ArrowRight') { e.preventDefault(); moveCamFocus(1, 0); }
      else if (key === 'ArrowUp') { e.preventDefault(); moveCamFocus(0, -1); }
      else if (key === 'ArrowDown') { e.preventDefault(); moveCamFocus(0, 1); }
      else if (key === 'Enter') { e.preventDefault(); activateCamFocus(); }
      else if (key === 'r' || key === 'R') { e.preventDefault(); refreshCameraWall(); }
      return;
    }

    if (state.mode === 'display') {
      if (key === 'r' || key === 'R') { e.preventDefault(); reloadPage(); }
      else if (key === '+' || key === '=') { e.preventDefault(); changeZoom(10); }
      else if (key === '-' || key === '_') { e.preventDefault(); changeZoom(-10); }
      else if (key === '0') { e.preventDefault(); state.zoomPercent = 100; applyZoom(); showInfo(); }
      else if (key === ' ') { e.preventDefault(); if (rotation.active) toggleRotationPause(); }
    }
  });

  /* ============================ 事件绑定 ============================ */

  el.btnSync.addEventListener('click', function () { syncFromServer(true); });
  el.btnTurbo.addEventListener('click', toggleTurbo);
  el.btnRotation.addEventListener('click', startRotation);
  el.btnZones.addEventListener('click', openZones);
  el.btnSettings.addEventListener('click', openSettings);
  el.btnFullscreen.addEventListener('click', toggleFullscreen);
  el.btnDisplayFullscreen.addEventListener('click', toggleFullscreen);
  // 设备控制：新标签打开独立控制台（显示端页面保持显示不受干扰）
  el.btnConsole.addEventListener('click', function () {
    window.open('/console', '_blank', 'noopener');
  });

  /* 「更多」二级菜单：点击开合；点菜单项后自动收起；点页面别处或按 Esc 也收起 */
  function setMoreMenu(open) {
    el.moreMenu.hidden = !open;
    el.btnMore.setAttribute('aria-expanded', open ? 'true' : 'false');
    el.btnMore.classList.toggle('on', open);
  }
  el.btnMore.addEventListener('click', function (e) {
    e.stopPropagation();
    setMoreMenu(el.moreMenu.hidden);
  });
  el.moreMenu.addEventListener('click', function (e) {
    // 菜单里的链接/按钮被点中后收起（链接是新标签打开，不影响当前页）
    if (e.target.closest('.menu-item')) setMoreMenu(false);
  });
  document.addEventListener('click', function (e) {
    if (!el.moreMenu.hidden && !el.moreMenu.contains(e.target) && e.target !== el.btnMore) setMoreMenu(false);
  });
  el.btnBack.addEventListener('click', backToHome);
  el.btnBack2.addEventListener('click', backToHome);
  el.btnZoneBack.addEventListener('click', backToHome);
  el.btnSettingsBack.addEventListener('click', backToHome);
  el.btnRetry.addEventListener('click', reloadPage);
  el.btnMenu.addEventListener('click', showDisplayMenu);
  el.btnUseProxy.addEventListener('click', function () {
    if (!state.entry) return;
    local.proxyModes[state.entry.id] = 'proxy';
    saveLocalSettings();
    renderModeButton();
    mountFrame(state.entry);
    toast('已切换为代理模式并重新加载');
  });
  el.btnOpenTab.addEventListener('click', openInTab);
  el.btnOpenTab2.addEventListener('click', openInTab);
  el.btnZoomIn.addEventListener('click', function () { changeZoom(10); });
  el.btnZoomOut.addEventListener('click', function () { changeZoom(-10); });
  el.btnZoomReset.addEventListener('click', function () { state.zoomPercent = 100; applyZoom(); showInfo(); });
  el.btnMode.addEventListener('click', toggleMode);
  el.btnRotationToggle.addEventListener('click', toggleRotationPause);
  el.btnZoneRefresh.addEventListener('click', function () { renderZones(); toast('已刷新全部页面'); });
  el.btnCamBack.addEventListener('click', backToHome);
  el.btnCamLayout.addEventListener('click', function () { setCameraLayout(camWall.layout === 1 ? 3 : 1); });
  el.btnCamRefresh.addEventListener('click', refreshCameraWall);

  window.addEventListener('resize', function () { applyZoom(); scaleZoneCells(); });

  /* ============================ 多设备互控 · 受控半边（纯显示端） ============================
   * 设计修订（用户反馈）：Web 显示端被控 = 画面跟随指令切换，**不锁定鼠标、无角标、无模式开关**——
   * 显示页永远可正常本地操作（远程换了台，本地随时点得动）；控制与场景在独立控制台 /console。
   *  - 3s 心跳（失败指数退避最长 30s）：注册 / 上报本机状态 / 领指令；
   *  - boot 恢复由服务端判定（managed + bootRestore），显示端只需带 boot 标志；
   *  - 电视端（APK 1.8）保留锁定与【菜单】模式开关；Web 显示端不需要。
   * ============================================================================ */

  var CTL_BEAT_MS = 3000;
  var ctl = {
    deviceId: null,          // 本机设备身份（localStorage 终身不变，与 IP 无关）
    kind: 'pc',              // pc | tablet（服务端仅用于图标与 bootRestore 默认值）
    ackedSeq: 0,             // 已确认应用的指令序号（内存态）
    lastApplied: null,       // 最近应用的展示指令 {cmd,args}：本地操作偏离它即自动交还
    boot: true,              // 本页面生命周期内的第一次心跳
    failStreak: 0,
    lastError: null          // 指令应用失败原因（随状态上报，控制台可见）
  };

  /** 实际状态是否仍在执行该指令（与电视端 ControlChannel 同一套比对规则） */
  function followsCommand(la, r) {
    if (!la || !r) return true;
    var a = la.args || {};
    switch (la.cmd) {
      case 'show':
      case 'camera':
        return (r.mode === 'page' || r.mode === 'camera') && r.entryId === a.entryId;
      case 'rotate':
        if (r.mode !== 'rotate' || !r.rotate) return false;
        return JSON.stringify(r.rotate.items || []) === JSON.stringify(a.items || []) &&
          Number(r.rotate.intervalSec) === Number(a.intervalSec); // index 随时间推进，不比对
      case 'zone':
        return r.mode === 'zone' && !!r.zone &&
          JSON.stringify(r.zone.slots || []) === JSON.stringify(a.slots || []);
      case 'home':
        return r.mode === 'home';
      default:
        return true; // 维护类不参与
    }
  }

  function detectKind() {
    var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    var mobileUA = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    var iPadOS = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
    return touch && (mobileUA || iPadOS) ? 'tablet' : 'pc';
  }

  function loadDeviceId() {
    try {
      var id = localStorage.getItem('tvshow.deviceId');
      if (id) return id;
      var bytes = new Uint8Array(4);
      crypto.getRandomValues(bytes);
      id = 'dev-' + Array.prototype.map.call(bytes, function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
      localStorage.setItem('tvshow.deviceId', id);
      return id;
    } catch (e) { return null; } // 存储被禁时退化为不注册（file:// 场景）
  }

  /** 上报的本机状态（服务端据此展示设备卡片，并可在「存为场景」时转为恢复指令） */
  function currentState() {
    var s = { mode: 'home' };
    if (state.mode === 'display') {
      if (rotation.active) {
        var list = rotationEntries();
        s = {
          mode: 'rotate',
          rotate: {
            index: rotation.index, total: list.length,
            intervalSec: local.rotation.intervalSec,
            items: list.map(function (e) { return e.id; })
          }
        };
      } else {
        s = { mode: 'page', entryId: state.entry ? state.entry.id : '' };
      }
    } else if (state.mode === 'camera') {
      s = { mode: 'camera', entryId: camWall.entry ? camWall.entry.id : '' };
    } else if (state.mode === 'zones') {
      s = { mode: 'zone', zone: { slots: local.zones.map(function (z) { return z.entryId || null; }) } };
    } else if (state.mode === 'settings') {
      s = { mode: 'settings' };
    }
    if (ctl.lastError) s.lastError = ctl.lastError;
    return s;
  }

  /** 指令应用器：全部复用现有 screen 切换函数，不新造状态机（受控=切画面，本地操作照常） */
  function applyCommand(desired) {
    var cmd = desired.cmd;
    var args = desired.args || {};
    ctl.lastError = null;
    if (cmd === 'show' || cmd === 'rotate' || cmd === 'zone' || cmd === 'home') {
      ctl.lastApplied = { cmd: cmd, args: args }; // 本地操作偏离它即自动交还（v6）
    }
    try {
      if (cmd === 'show') {
        var entry = entryOf(args.entryId);
        if (!entry) { backToHome(); ctl.lastError = '指令引用的入口已不存在'; }
        else openEntry(entry, { embed: true });
      } else if (cmd === 'rotate') {
        local.rotation = {
          enabled: local.rotation.enabled,
          intervalSec: Math.min(3600, Math.max(1, Number(args.intervalSec) || 15)),
          items: (args.items || []).filter(function (id) { return !!entryOf(id); }),
          // 同相切换时服务端已生成统一起点；否则以本机收到时刻起算
          startedAt: Number(args.startedAt) || correctedNow()
        };
        saveLocalSettings();
        stopRotation();
        // 序列里的入口在本机内容同步滞后时可能暂不可见；全部失效则不进轮询
        // （不能落到 startRotation 的「首次进入默认全部参与」分支）
        if (!local.rotation.items.length) {
          backToHome();
          ctl.lastError = '轮询序列中的入口在本机均不可用';
        } else {
          startRotation();
        }
      } else if (cmd === 'zone') {
        var slots = Array.isArray(args.slots) ? args.slots : [null, null, null, null];
        local.zones = [0, 1, 2, 3].map(function (p) {
          var id = slots[p] && entryOf(slots[p]) ? slots[p] : '';
          return { position: p, entryId: id };
        });
        saveLocalSettings();
        openZones();
      } else if (cmd === 'home') {
        backToHome();
      } else if (cmd === 'refresh') {
        if (state.mode === 'display') reloadPage();
        else if (state.mode === 'zones') { renderZones(); toast('已刷新全部页面'); }
        else if (state.mode === 'camera') refreshCameraWall();
      } else if (cmd === 'sync') {
        syncFromServer(true);
      }
    } catch (e) {
      ctl.lastError = '指令应用失败：' + (e && e.message ? e.message : e);
    }
  }

  async function doBeat() {
    if (!ctl.deviceId) return; // 无存储（file:// 且禁用 localStorage）时静默不注册
    if (!SERVER_BASE && !servedOverHttp) return;
    var body = {
      deviceId: ctl.deviceId,
      kind: ctl.kind,
      appVersion: '2.0-web',
      boot: ctl.boot,
      ackedSeq: ctl.ackedSeq,
      state: currentState()
    };
    ctl.boot = false;
    // 现场本地操作偏离指令画面 → 自动交还本地（服务端 managed=false，控制台如实显示）
    if (ctl.lastApplied && !followsCommand(ctl.lastApplied, body.state)) {
      body.switchTo = 'local';
      ctl.lastApplied = null;
    }
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 5000);
    try {
      var res = await fetch(SERVER_BASE + '/api/ctl/beat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: ctrl.signal,
        cache: 'no-store'
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      ctl.failStreak = 0;
      // 内容版本比对：服务端配置有更新（管理后台保存等）→ 立即强制同步（≤3 秒生效）
      if (json.content && (Number(json.content.version) !== Number(CFG.version) ||
          Number(json.content.epoch) !== Number(CFG.epoch))) {
        syncFromServer(true);
      }
      if (json.desired) {
        ctl.pendingRelease = false; // 新指令优先：交还意图已被服务端忽略
        applyCommand(json.desired);
        ctl.ackedSeq = json.desired.seq;
      } else if (ctl.pendingRelease && json.managed === false) {
        // 交还意图已送达确认
        ctl.pendingRelease = false;
        ctl.lastApplied = null;
      }
    } catch (e) {
      clearTimeout(timer);
      ctl.failStreak++;
      // 离线保持：画面继续（本机设置已写入），恢复后心跳自动续上
    } finally {
      var delay = ctl.failStreak === 0
        ? CTL_BEAT_MS
        : Math.min(9000, CTL_BEAT_MS * Math.pow(2, ctl.failStreak)); // 退避上限 9s = 3 次心跳（离线判定周期）
      setTimeout(doBeat, delay);
    }
  }

  function initCtl() {
    ctl.deviceId = loadDeviceId();
    ctl.kind = detectKind();
    if (ctl.deviceId) doBeat();
  }


  loadLocalSettings();
  renderTurboButton();
  applyConfig(CFG, false);
  syncClockOffset();
  // 启动不阻塞于网络：先用兜底内容渲染首屏，再后台增量同步
  syncFromServer(false);
  initCtl(); // 多设备互控：注册心跳 + 领指令（受控半边；控制台在独立页 /console）
  setTimeout(function () { if (!rotation.active) applyZoom(); }, 200);
})();
</script>
</body>
</html>
